<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Our Memory Book · 3D Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/renderers/CSS3DRenderer.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>
:root{--pink:#ff9fc7;--glow:#ff5ea5;--ink:#fff4fa}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05020a;color:var(--ink);font-family:'ZCOOL KuaiLe','PingFang SC',sans-serif;touch-action:none}
#stage{position:fixed;inset:0;background:radial-gradient(circle at 50% 42%,rgba(83,20,70,.25),transparent 42%),radial-gradient(circle,rgba(27,8,31,.5),#05020a 78%)}
#css{position:absolute;inset:0;z-index:2}
#hud{position:fixed;z-index:20;top:5vh;left:0;right:0;text-align:center;pointer-events:none;text-shadow:0 2px 10px #000}
.title{font:700 32px Caveat,cursive;color:var(--pink);letter-spacing:2px}.hint{margin-top:8px;font-size:13px;opacity:.7}
#loader{position:fixed;z-index:40;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,2,10,.94);transition:opacity .7s ease}
#loader.hide{opacity:0;pointer-events:none}.load-box{width:min(84vw,380px);padding:28px 24px;text-align:center;border:1px solid rgba(255,180,215,.3);border-radius:24px;background:rgba(255,255,255,.07);box-shadow:0 16px 50px #0008}.load-title{font:700 31px Caveat,cursive;color:var(--pink);margin-bottom:14px}.load-text{font-size:16px}.bar{height:8px;margin:18px 0 8px;border-radius:8px;background:#ffffff1c;overflow:hidden}.bar>i{display:block;width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,#ffc1da,var(--glow));box-shadow:0 0 16px var(--glow);transition:width .2s}.count{font-size:12px;opacity:.7}
#actions{position:fixed;z-index:25;left:0;right:0;bottom:5vh;text-align:center;pointer-events:none;opacity:0;transition:opacity .5s}#actions.show{opacity:1;pointer-events:auto}button{font:16px 'ZCOOL KuaiLe',sans-serif;color:white;border:1px solid #ffb6d5aa;border-radius:30px;padding:12px 27px;background:#ff709e99;box-shadow:0 0 20px #ff4e9e55;cursor:pointer}button:active{transform:scale(.96)}
/* The book is made from CSS3DObjects. These elements are transparent line-art surfaces, not a flat overlay. */
.book-base,.book-cover,.book-spine,.paper,.face{position:relative;transform-style:preserve-3d;pointer-events:none}
.book-base{border:2px solid #ffb5d78c;background:#ffffff08;box-shadow:0 0 18px #ff5ea566,inset 0 0 22px #ff9bc51c}.book-base.left{border-right:0;border-radius:22px 0 0 22px}.book-base.right{border-left:0;border-radius:0 22px 22px 0}
.book-spine{background:#ffc1dfdd;border-radius:8px;box-shadow:0 0 20px var(--glow)}
.book-cover{border:3px solid #ff9fcae6;background:transparent;box-shadow:0 0 22px #ff55a866}.book-cover.left{border-right:0;border-radius:20px 0 0 20px}.book-cover.right{border-left:0;border-radius:0 20px 20px 0}
.paper{border:2px solid #ffc6dfdd;border-radius:3px 20px 20px 3px;background:#fffaf2;box-shadow:7px 0 0 #ebd9dcaa,0 0 18px #ff66aa66,inset 0 0 24px #71453b2c}
.face{position:absolute;inset:0;overflow:hidden;background:#fffaf2;backface-visibility:hidden}.face.front{border-radius:2px 17px 17px 2px;transform:translateZ(2px)}.face.back{border-radius:17px 2px 2px 17px;transform:rotateY(180deg) translateZ(2px)}.face img{display:block;width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none}
@media(max-width:700px){.title{font-size:27px}.hint{font-size:12px}.load-box{padding:24px 20px}.book-base,.book-cover,.paper{border-width:1.5px}}
</style>
</head>
<body>
<div id="stage"><div id="css"></div></div>
<div id="hud"><div class="title">Our Memory Book</div><div class="hint">拖动屏幕，让书本从不同角度呈现</div></div>
<div id="loader"><div class="load-box"><div class="load-title">A little book of us</div><div class="load-text" id="status">正在准备高清照片…</div><div class="bar"><i id="progress"></i></div><div class="count" id="count">照片准备中 0 / 6</div></div></div>
<div id="actions"><button id="replay">重新翻阅</button></div>
<script>
(() => {
'use strict';
const PHOTO_BASE='assets/images/';
const PHOTO_COUNT=6;
const pageW=window.innerWidth<=700?410:570;
const pageH=window.innerWidth<=700?560:760;
let camera,scene,renderer,controls,book,activeRun=0;
let currentPages=[];
const $=id=>document.getElementById(id);
function setProgress(done){$('progress').style.width=Math.round(done/PHOTO_COUNT*100)+'%';$('count').textContent=`照片准备中 ${done} / ${PHOTO_COUNT}`}
function loadPhoto(index){
  const url=PHOTO_BASE+index+'.webp';
  return new Promise((resolve,reject)=>{
    const img=new Image(); img.decoding='async';
    img.onload=()=>{const finish=()=>resolve({index,url}); if(img.decode)img.decode().catch(()=>{}).finally(finish);else finish()};
    img.onerror=()=>reject(new Error('photo '+index+' failed')); img.src=url;
  });
}
async function loadAllPhotos(){
  const result=[];let done=0;
  for(let i=1;i<=PHOTO_COUNT;i++){
    try{result.push(await loadPhoto(i))}catch(e){console.warn(e);result.push({index:i,url:PHOTO_BASE+i+'.webp'})}
    done++;setProgress(done)
  }
  return result;
}
function panel(className,w,h){const e=document.createElement('div');e.className=className;e.style.width=w+'px';e.style.height=h+'px';return e}
function cssObject(className,w,h,x,y,z){const o=new THREE.CSS3DObject(panel(className,w,h));o.position.set(x,y,z);return o}
function createBook(photos){
  book=new THREE.Group();book.position.set(0,0,0);book.rotation.set(THREE.MathUtils.degToRad(-8),THREE.MathUtils.degToRad(-10),0);book.scale.set(.7,.7,.7);scene.add(book);
  book.add(cssObject('book-base left',pageW,pageH,-pageW/2,0,-30));
  book.add(cssObject('book-base right',pageW,pageH,pageW/2,0,-30));
  book.add(cssObject('book-spine',14,pageH+38,0,0,50));
  book.add(cssObject('book-cover left',pageW,pageH,-pageW/2,0,42));
  const coverHinge=new THREE.Object3D();coverHinge.position.set(0,0,48);book.add(coverHinge);
  const coverRight=new THREE.CSS3DObject(panel('book-cover right',pageW,pageH));coverRight.position.set(pageW/2,0,0);coverHinge.add(coverRight);
  currentPages=photos.map((photo,index)=>{
    const hinge=new THREE.Object3D();hinge.position.set(0,0,40-index*3);book.add(hinge);
    const paper=panel('paper',pageW,pageH);paper.style.zIndex=String(50-index);
    const front=panel('face front',pageW,pageH),back=panel('face back',pageW,pageH);
    [front,back].forEach(face=>{const img=document.createElement('img');img.src=photo.url;img.alt='我们的回忆 '+photo.index;img.draggable=false;face.appendChild(img);paper.appendChild(face)});
    const page=new THREE.CSS3DObject(paper);page.position.set(pageW/2,0,0);hinge.add(page);
    return {hinge,paper};
  });
  return coverHinge;
}
function clearBook(){if(book){book.visible=false;scene.remove(book);book.traverse(o=>{if(o.element)o.element.remove()});book=null}currentPages=[]}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}
async function flipOne(page,index,run){if(run!==activeRun)return false;await wait(index?120:420);const start=page.hinge.rotation.y;const end=-Math.PI;const t0=performance.now();return await new Promise(resolve=>{function frame(now){if(run!==activeRun){resolve(false);return}const p=Math.min(1,(now-t0)/760);const e=p<.5?4*p*p*p/2:1-Math.pow(-2*p+2,3)/2;page.hinge.rotation.y=start+(end-start)*e;if(p<1)requestAnimationFrame(frame);else{page.hinge.rotation.y=end;page.paper.style.zIndex=String(8+index);resolve(true)}}requestAnimationFrame(frame)})}
async function runBook(photos){
  const run=++activeRun;clearBook();$('actions').classList.remove('show');const coverHinge=createBook(photos);$('loader').classList.add('hide');
  await new Promise(r=>requestAnimationFrame(r));
  book.visible=true;let t0=performance.now();const open=()=>{const p=Math.min(1,(performance.now()-t0)/820);const e=1-Math.pow(1-p,3);book.scale.set(.7+.3*e,.7+.3*e,.7+.3*e);book.rotation.set(THREE.MathUtils.degToRad(-8+5*e),THREE.MathUtils.degToRad(-10+10*e),0);if(p<1)requestAnimationFrame(open)};requestAnimationFrame(open);
  await wait(600);let a={v:0};await tweenValue(a,'v',1,850,v=>coverHinge.rotation.y=-Math.PI*.9*v,run);
  for(let i=0;i<currentPages.length;i++){if(!(await flipOne(currentPages[i],i,run)))return}
  await wait(700);$('status').textContent='相册已摊开，拖动屏幕查看 3D 书本';$('actions').classList.add('show');
}
function tweenValue(obj,key,to,duration,onUpdate,run){return new Promise(resolve=>{const from=obj[key],t0=performance.now();function f(now){if(run!==activeRun){resolve(false);return}const p=Math.min(1,(now-t0)/duration);const e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;obj[key]=from+(to-from)*e;onUpdate(obj[key]);if(p<1)requestAnimationFrame(f);else resolve(true)}requestAnimationFrame(f)})}
function init(){scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,1,10000);camera.position.set(0,0,2050);renderer=new THREE.CSS3DRenderer();renderer.setSize(innerWidth,innerHeight);$('css').appendChild(renderer.domElement);controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.07;controls.enablePan=false;controls.minDistance=900;controls.maxDistance=4200;controls.autoRotate=false;window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate()}
$('replay').addEventListener('click',()=>{const photos=Array.from({length:PHOTO_COUNT},(_,i)=>({index:i+1,url:PHOTO_BASE+(i+1)+'.webp'}));$('loader').classList.remove('hide');$('status').textContent='正在重新准备高清照片…';setProgress(0);loadAllPhotos().then(runBook)});
init();loadAllPhotos().then(photos=>runBook(photos)).catch(()=>{ $('status').textContent='照片加载失败，请重新加载页面'; });
})();
</script>
</body>
</html>
