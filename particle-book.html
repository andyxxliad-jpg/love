<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Particle Memory Book</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03050a;color:#fff;font-family:system-ui,'PingFang SC',sans-serif;touch-action:none}
#webgl{position:fixed;inset:0}#veil{position:fixed;inset:0;z-index:5;background:radial-gradient(circle at center,#10152588,#03050af5 76%);pointer-events:none;transition:opacity .8s}.hide{opacity:0}
#loading{position:fixed;z-index:10;inset:0;display:flex;align-items:center;justify-content:center;background:#03050af2;transition:opacity .8s}.loading-box{width:min(84vw,390px);padding:30px 25px;text-align:center;border:1px solid #ffffff35;border-radius:22px;background:#ffffff0b;box-shadow:0 18px 50px #000b}.title{font-size:28px;letter-spacing:2px;margin-bottom:14px;color:#fff}.text{font-size:15px;opacity:.88}.bar{height:7px;margin:18px 0 8px;border-radius:9px;background:#ffffff20;overflow:hidden}.bar i{display:block;width:0;height:100%;background:#fff;border-radius:inherit;box-shadow:0 0 15px #fff;transition:width .25s}.count{font-size:12px;opacity:.6}#hint{position:fixed;z-index:4;top:6vh;left:0;right:0;text-align:center;opacity:.7;font-size:13px;pointer-events:none}#replay{position:fixed;z-index:8;bottom:6vh;left:50%;transform:translateX(-50%);padding:12px 28px;border:1px solid #ffffff66;border-radius:30px;background:#ffffff18;color:#fff;font-size:15px;display:none}#replay.show{display:block}
</style>
</head>
<body>
<div id="webgl"></div><div id="veil"></div><div id="hint">拖动屏幕查看粒子书本的立体结构</div>
<div id="loading"><div class="loading-box"><div class="title">A Book Made of Light</div><div class="text" id="status">正在准备照片粒子…</div><div class="bar"><i id="progress"></i></div><div class="count" id="count">照片准备中 0 / 6</div></div></div>
<button id="replay">重新播放</button>
<script>
(()=>{
'use strict';
const PHOTO_COUNT=6, BASE='assets/images/';
const $=id=>document.getElementById(id);
let renderer,scene,camera,controls,points,records=[],startTime=0,runId=0;
const W=620,H=820;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function loadImage(index){return new Promise((resolve,reject)=>{const img=new Image();img.decoding='async';img.onload=()=>{const finish=()=>resolve(img);if(img.decode)img.decode().catch(()=>{}).finally(finish);else finish()};img.onerror=reject;img.src=BASE+index+'.webp'})}
function progress(n){$('progress').style.width=Math.round(n/PHOTO_COUNT*100)+'%';$('count').textContent=`照片准备中 ${n} / ${PHOTO_COUNT}`}
function imagePoints(img,page){
 const canvas=document.createElement('canvas'),cw=82,ch=108;canvas.width=cw;canvas.height=ch;const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,cw,ch);const data=ctx.getImageData(0,0,cw,ch).data;
 for(let y=0;y<ch;y++)for(let x=0;x<cw;x++){const k=(y*cw+x)*4,lum=(data[k]+data[k+1]+data[k+2])/3,alpha=data[k+3];if(alpha>30&&lum>28){const density=lum>145?1:lum>80?.72:.46;if(Math.random()<density)records.push({kind:'page',page,u:x/(cw-1)*W,v:(.5-y/(ch-1))*H*.92,z:(Math.random()-.5)*7,seed:Math.random()*2-1})}}
}
function line(a,b,step=12){const n=Math.max(2,Math.ceil(Math.hypot(b.x-a.x,b.y-a.y)/step));for(let i=0;i<n;i++){const t=i/(n-1);records.push({kind:'static',x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t,z:a.z+(b.z-a.z)*t,seed:Math.random()*2-1})}}
function buildFrame(){
 const d=22,z=25;
 // open-book outer lines, page edges, spine and page thickness; all are white particles.
 line({x:-W,y:-H/2,z},{x:0,y:-H/2,z});line({x:0,y:-H/2,z},{x:W,y:-H/2,z});line({x:-W,y:H/2,z},{x:0,y:H/2,z});line({x:0,y:H/2,z},{x:W,y:H/2,z});
 line({x:-W,y:-H/2,z},{x:-W,y:H/2,z});line({x:W,y:-H/2,z},{x:W,y:H/2,z});line({x:0,y:-H/2,z-8},{x:0,y:H/2,z-8},8);
 for(let i=1;i<9;i++){const zz=z-i*7;line({x:-W,y:-H/2+10,z:zz},{x:0,y:-H/2+10,z:zz},15);line({x:0,y:-H/2+10,z:zz},{x:W,y:-H/2+10,z:zz},15)}
 // glowing hinge marks make the depth of the spine readable.
 for(let y=-H/2+30;y<=H/2-30;y+=18)records.push({kind:'static',x:0,y,z:z+12,seed:Math.random()*2-1});
}
function makeGeometry(){
 const n=records.length,pos=new Float32Array(n*3),col=new Float32Array(n*3);
 for(let i=0;i<n;i++){const r=records[i];r.random={x:(Math.random()-.5)*4200,y:(Math.random()-.5)*3000,z:(Math.random()-.5)*2400};pos[i*3]=r.random.x;pos[i*3+1]=r.random.y;pos[i*3+2]=r.random.z;col[i*3]=1;col[i*3+1]=1;col[i*3+2]=1}
 const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(pos,3));geo.setAttribute('color',new THREE.BufferAttribute(col,3));
 const mat=new THREE.PointsMaterial({size:window.innerWidth<700?5:4,vertexColors:true,transparent:true,opacity:.92,blending:THREE.AdditiveBlending,depthWrite:false});points=new THREE.Points(geo,mat);scene.add(points)
}
function targetFor(r,phase,now){
 if(r.kind==='static')return{x:r.x,y:r.y,z:r.z};
 // Every photo page rotates around the center hinge as a real page would.
 const pageAngle=phase.pageAngles[r.page]||0,u=r.u;const c=Math.cos(pageAngle),s=Math.sin(pageAngle);
 return{x:c*u,y:r.v,z:32+s*u+r.z};
}
function setBookState(time,run){
 if(run!==runId)return;
 const p=points.geometry.attributes.position.array;
 const phase={pageAngles:[0,0,0,0,0,0],assemble:0,scatter:0,heart:0};
 const assembleEnd=1700,flipStart=2100,flipEach=620,flipDuration=470,spreadEnd=flipStart+PHOTO_COUNT*flipEach+flipDuration;
 if(time<assembleEnd)phase.assemble=ease(clamp(time/assembleEnd,0,1));else phase.assemble=1;
 if(time>=flipStart){for(let i=0;i<PHOTO_COUNT;i++){const q=clamp((time-(flipStart+i*flipEach))/flipDuration,0,1);phase.pageAngles[i]=-Math.PI*ease(q)}}
 const cameraStart=spreadEnd+250;
 const scatterStart=cameraStart+1100;
 const heartStart=scatterStart+1050;
 if(time>=scatterStart)phase.scatter=ease(clamp((time-scatterStart)/900,0,1));
 if(time>=heartStart)phase.heart=ease(clamp((time-heartStart)/1350,0,1));
 for(let i=0;i<records.length;i++){
  const r=records[i],base=targetFor(r,phase,time),j=i*3;
  let tx=base.x,ty=base.y,tz=base.z;
  if(phase.scatter){const d=850+Math.abs(r.seed)*1800;tx+=r.seed*d;ty+=(r.seed>.2?1:-1)*(500+Math.abs(r.seed)*1500);tz+=((i%3)-1)*900*phase.scatter}
  if(phase.heart){
   const q=i/Math.max(1,records.length-1),t=q*Math.PI*2;
   const hx=16*Math.pow(Math.sin(t),3)*45;
   const hy=(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))*45;
   const hz=(r.seed*260)+Math.sin(t*3)*120;
   tx=tx+(hx-tx)*phase.heart;ty=ty+(hy-ty)*phase.heart;tz=tz+(hz-tz)*phase.heart;
  }
  const a=phase.assemble;p[j]=r.random.x+(tx-r.random.x)*a;p[j+1]=r.random.y+(ty-r.random.y)*a;p[j+2]=r.random.z+(tz-r.random.z)*a;
 }
 points.geometry.attributes.position.needsUpdate=true;
 if(time>=cameraStart){const q=ease(clamp((time-cameraStart)/1100,0,1));camera.position.z=2050+(560-2050)*q;camera.position.x=0;camera.position.y=0;controls.target.set(0,0,0)}
 if(time>heartStart+1500){$('status').textContent='白色粒子爱心已完成，拖动屏幕查看 3D 效果';$('replay').classList.add('show');controls.enabled=true;return false}
 return true;
}
function animate(now){requestAnimationFrame(animate);const t=now-startTime;if(!setBookState(t,runId)&&!controls.enabled){}controls.update();renderer.render(scene,camera)}
function resetCamera(){camera.position.set(0,0,2050);controls.target.set(0,0,0);controls.enabled=false}
async function start(){const my=++runId;$('replay').classList.remove('show');$('loading').classList.remove('hide');$('status').textContent='正在准备照片粒子…';progress(0);records=[];for(let i=1;i<=PHOTO_COUNT;i++){try{const img=await loadImage(i);imagePoints(img,i-1)}catch(e){console.warn(e)}progress(i)}buildFrame();if(points)scene.remove(points);makeGeometry();resetCamera();$('loading').classList.add('hide');$('veil').classList.remove('hide');startTime=performance.now();controls.enabled=false;}
function init(){scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(43,innerWidth/innerHeight,1,10000);renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);$('webgl').appendChild(renderer.domElement);controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.06;controls.enablePan=false;controls.minDistance=430;controls.maxDistance=4200;controls.autoRotate=false;window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});$('replay').addEventListener('click',start);start();requestAnimationFrame(animate)}
init();
})();
</script>
</body>
</html>
