<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Our Particle Memory Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #03040a; color: #fff;
  font-family: 'ZCOOL KuaiLe', 'PingFang SC', sans-serif; touch-action: none; }
#scene { position: fixed; inset: 0; }
#hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
#title { position: absolute; top: 5vh; left: 0; right: 0; text-align: center;
  font: 700 30px Caveat, cursive; color: #fff; letter-spacing: 2px; text-shadow: 0 0 18px rgba(255,255,255,.65); }
#subtitle { margin-top: 6px; font: 13px 'ZCOOL KuaiLe', sans-serif; letter-spacing: 2px; color: #cfd6ff; opacity: .75; }
#page-ind { position: absolute; top: 5vh; right: 4vw; font-size: 14px; color: #e8ecff; opacity: .8;
  background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.25); border-radius: 20px; padding: 6px 14px; }
#hint { position: absolute; bottom: 4vh; left: 0; right: 0; text-align: center; font-size: 13px; color: #cfd6ff; opacity: .7; }
#loading { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center;
  background: #03040a; transition: opacity .8s ease; }
#loading.hidden { opacity: 0; pointer-events: none; }
.load-box { width: min(84vw, 360px); padding: 28px 22px; text-align: center; border: 1px solid rgba(255,255,255,.22);
  border-radius: 24px; background: rgba(255,255,255,.06); box-shadow: 0 16px 50px rgba(0,0,0,.7); }
.load-title { font: 700 30px Caveat, cursive; color: #fff; letter-spacing: 2px; margin-bottom: 14px; text-shadow: 0 0 20px rgba(255,255,255,.8); }
.load-text { font-size: 15px; color: #dfe4ff; }
.bar { height: 7px; margin: 18px 0 8px; border-radius: 8px; background: rgba(255,255,255,.15); overflow: hidden; }
.bar i { display: block; width: 0; height: 100%; background: linear-gradient(90deg,#e8ecff,#ffffff); box-shadow: 0 0 14px #fff; border-radius: inherit; transition: width .25s; }
.load-count { font-size: 12px; color: #aab2d8; }
</style>
</head>
<body>
<div id="scene"></div>
<div id="hud">
  <div id="title">andy ♥ 陶陶<span id="subtitle"><br>OUR PARTICLE MEMORY BOOK</span></div>
  <div id="page-ind">第 1 / 60 页</div>
  <div id="hint">点击书页左右两侧翻页 · 拖动旋转书本</div>
</div>
<div id="loading">
  <div class="load-box">
    <div class="load-title">A book made of stardust</div>
    <div class="load-text" id="status">正在采集照片粒子…</div>
    <div class="bar"><i id="progress"></i></div>
    <div class="load-count" id="count">照片准备中 0 / 2</div>
  </div>
</div>
<script>
window.onerror = function(msg, src, line, col, err) {
  var s = document.getElementById('status');
  if (s) s.textContent = 'JS错误: ' + msg + ' @' + line;
  console.error(msg, err);
};
window.addEventListener('unhandledrejection', function(e) {
  var s = document.getElementById('status');
  if (s) s.textContent = '异步错误: ' + e.reason;
  console.error(e.reason);
});
(() => {
'use strict';
const PAGE_W = 470, PAGE_H = 700;          // 单页尺寸
const COLS = 62, ROWS = 92;                // 照片采样网格
const MAX_PARTICLES_PER_PAGE = 2800;       // 每页粒子上限
const TOTAL_PAIRS = 60;                    // 60 页 = 120 张照片
let pageIndex = 0;                          // 0..59，显示照片 (2n+1, 2n+2)
let busy = false;

let renderer, scene, camera, controls, bookGroup, starPoints;
let leftPoints, rightPoints, titlePoints, framePoints;
let leftAttr, rightAttr;
const leftFrom = { pos: [], col: [] }, leftTo = { pos: [], col: [] };
const rightFrom = { pos: [], col: [] }, rightTo = { pos: [], col: [] };
let animState = null;
const imgCache = new Map();

const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
const lerp = (a,b,t) => a + (b-a)*t;

// ---------- 照片加载与粒子采样 ----------
function getImage(index) {
  const url = `assets/images/${index}.webp`;
  if (imgCache.has(url)) return imgCache.get(url);
  const p = new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = url;
  });
  imgCache.set(url, p);
  return p;
}
function samplePhoto(img, side, outPos, outCol) {
  // side: 1 = 右页, -1 = 左页
  outPos.length = 0; outCol.length = 0;
  if (!img) {
    // 失败时铺一层稀疏星光占位
    for (let i = 0; i < 500; i++) {
      outPos.push(side*(PAGE_W/2 + Math.random()*PAGE_W*0.5), (Math.random()-.5)*PAGE_H, (Math.random()-.5)*6);
      outCol.push(.8,.8,.9);
    }
    return;
  }
  const canvas = document.createElement('canvas');
  canvas.width = COLS; canvas.height = ROWS;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const scale = Math.max(COLS/img.naturalWidth, ROWS/img.naturalHeight);
  const dw = img.naturalWidth*scale, dh = img.naturalHeight*scale;
  ctx.drawImage(img, (COLS-dw)/2, (ROWS-dh)/2, dw, dh);
  const data = ctx.getImageData(0,0,COLS,ROWS).data;
  const cells = [];
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const i = (y*COLS+x)*4;
    const r = data[i], g = data[i+1], b = data[i+2], a = data[i+3];
    if (a < 110) continue;
    const lum = (.299*r + .587*g + .114*b)/255;
    let prob = 0;
    if (lum >= .75) prob = 1;
    else if (lum >= .5) prob = .95;
    else if (lum >= .3) prob = .75;
    else if (lum >= .15) prob = .4;
    else prob = .1;
    if (Math.random() > prob) continue;
    cells.push({ x, y, r, g, b, lum });
  }
  // 上限截断：按亮度优先保留
  if (cells.length > MAX_PARTICLES_PER_PAGE) {
    cells.sort((A,B) => B.lum - A.lum);
    cells.length = MAX_PARTICLES_PER_PAGE;
  }
  for (const c of cells) {
    const u = (c.x + .5)/COLS, v = (c.y + .5)/ROWS;
    // 页面局部坐标：右页 x∈[0,PAGE_W]，左页 x∈[-PAGE_W,0]
    const px = side * u * PAGE_W;
    const py = (0.5 - v) * PAGE_H;
    outPos.push(px, py + (Math.random()-.5)*2, (Math.random()-.5)*4);
    const br = .28 + c.lum*1.35;
    outCol.push(c.r/255*br, c.g/255*br, c.b/255*br);
  }
}

// ---------- 书本结构粒子（白色） ----------
function buildFrameParticles() {
  const pos = [], col = [];
  const push = (x,y,z,c) => { pos.push(x,y,z); col.push(c,c,c); };
  const W = PAGE_W + 40, H = PAGE_H + 40, D = -52;
  // 底板边框（书皮轮廓）
  const step = 15;
  for (let x = -W/2; x <= W/2; x += step) { push(x,-H/2,D,.62); push(x,H/2,D,.62); }
  for (let y = -H/2; y <= H/2; y += step) { push(-W/2,y,D,.62); push(W/2,y,D,.62); }
  // 底板稀疏填充
  for (let x = -W/2+20; x <= W/2-20; x += 46) for (let y = -H/2+20; y <= H/2-20; y += 46)
    if (Math.random() < .28) push(x,y,D,.16);
  // 左右页边框（正面）
  for (const side of [-1,1]) {
    for (let x = 0; x <= PAGE_W; x += 13) { push(side*(PAGE_W/2+x), -PAGE_H/2, 0, .95); push(side*(PAGE_W/2+x), PAGE_H/2, 0, .95); }
    for (let y = -PAGE_H/2; y <= PAGE_H/2; y += 13) { push(side*PAGE_W/2, y, 0, .95); push(side*(PAGE_W/2+PAGE_W), y, 0, .95); }
    // 页面厚度层
    const layers = [[-12,.58],[-26,.42],[-40,.28],[-52,.16]];
    for (const [z, c] of layers)
      for (let x = 0; x <= PAGE_W; x += 17) { push(side*(PAGE_W/2+x), -PAGE_H/2, z, c); push(side*(PAGE_W/2+x), PAGE_H/2, z, c); }
  }
  // 书脊：中缝隆起，多列弧线
  for (let x = -10; x <= 10; x += 4) {
    const lift = 26 * (1 - (x/10)*(x/10));  // 中间最高
    for (let y = -PAGE_H/2; y <= PAGE_H/2; y += 10) {
      push(x, y, D + 78*(1-(x/10)*(x/10))*.55, .98);
    }
  }
  // 书脊顶部高光列
  for (let y = -PAGE_H/2; y <= PAGE_H/2; y += 7) push(0, y, 8, 1);
  return { pos, col };
}
// ---------- 标题粒子（andy ♥ 陶陶） ----------
function buildTitleParticles() {
  const canvas = document.createElement('canvas');
  canvas.width = 360; canvas.height = 110;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#000'; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 44px "PingFang SC", "Noto Sans SC", sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('andy ♥ 陶陶', canvas.width/2, canvas.height/2);
  const data = ctx.getImageData(0,0,canvas.width,canvas.height).data;
  const pos = [], col = [];
  const TW = 280, TH = 90;
  for (let y = 0; y < canvas.height; y += 2) for (let x = 0; x < canvas.width; x += 2) {
    const i = (y*canvas.width+x)*4;
    if (data[i+3] > 120) {
      pos.push((x/canvas.width-.5)*TW, (.5-y/canvas.height)*TH + PAGE_H/2 + 150, 46);
      const b = .75 + Math.random()*.25;
      col.push(b,b,b);
    }
  }
  return { pos, col };
}

// ---------- 初始化 ----------
function init() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 1, 20000);
  camera.position.set(0, 300, 1750);
  camera.lookAt(0, 0, 0);
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  $('scene').appendChild(renderer.domElement);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 0, 0);
  controls.enableZoom = false;
  controls.enablePan = false;
  controls.minPolarAngle = 0.9;
  controls.maxPolarAngle = 1.7;
  controls.enableDamping = true;
  controls.dampingFactor = .08;
  controls.autoRotate = false;

  // 书本组
  bookGroup = new THREE.Group();
  bookGroup.rotation.x = 0.46;
  scene.add(bookGroup);
  // 星空
  const starGeo = new THREE.BufferGeometry();
  const sp = new Float32Array(2200*3), sc = new Float32Array(2200*3);
  for (let i = 0; i < 2200; i++) {
    const r = 2600 + Math.random()*3600;
    const t = Math.random()*Math.PI*2, p = Math.acos(2*Math.random()-1);
    sp[i*3] = r*Math.sin(p)*Math.cos(t);
    sp[i*3+1] = r*Math.sin(p)*Math.sin(t);
    sp[i*3+2] = r*Math.cos(p);
    const b = .25 + Math.random()*.75;
    sc[i*3] = b; sc[i*3+1] = b; sc[i*3+2] = b;
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(sp,3));
  starGeo.setAttribute('color', new THREE.BufferAttribute(sc,3));
  starPoints = new THREE.Points(starGeo, new THREE.PointsMaterial({
    size: 2.4, vertexColors: true, transparent: true, opacity: .9,
    blending: THREE.AdditiveBlending, depthWrite: false }));
  scene.add(starPoints);

  // 结构粒子（白色，随书本一起）
  const fp = buildFrameParticles();
  const fGeo = new THREE.BufferGeometry();
  fGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(fp.pos),3));
  fGeo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(fp.col),3));
  framePoints = new THREE.Points(fGeo, new THREE.PointsMaterial({
    size: 4.2, vertexColors: true, transparent: true, opacity: .95,
    blending: THREE.AdditiveBlending, depthWrite: false }));
  bookGroup.add(framePoints);

  // 左右照片粒子
  const mkPhotoPoints = () => {
    const geo = new THREE.BufferGeometry();
    const pos = new Float32Array(MAX_PARTICLES_PER_PAGE*3);
    const col = new Float32Array(MAX_PARTICLES_PER_PAGE*3);
    geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
    geo.setAttribute('color', new THREE.BufferAttribute(col,3));
    const pts = new THREE.Points(geo, new THREE.PointsMaterial({
      size: 5.2, vertexColors: true, transparent: true, opacity: .92,
      blending: THREE.AdditiveBlending, depthWrite: false }));
    bookGroup.add(pts);
    return pts;
  };
  leftPoints = mkPhotoPoints();
  rightPoints = mkPhotoPoints();
  leftAttr = leftPoints.geometry.attributes.position;
  rightAttr = rightPoints.geometry.attributes.position;

  // 标题粒子
  const tp = buildTitleParticles();
  const tGeo = new THREE.BufferGeometry();
  tGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(tp.pos),3));
  tGeo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(tp.col),3));
  titlePoints = new THREE.Points(tGeo, new THREE.PointsMaterial({
    size: 5.6, vertexColors: true, transparent: true, opacity: 1,
    blending: THREE.AdditiveBlending, depthWrite: false }));
  bookGroup.add(titlePoints);

  window.addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    fitBook();
  });
  fitBook();
  animate();
}
function fitBook() {
  const fov = camera.fov*Math.PI/180;
  const dist = camera.position.length();
  const worldH = 2*dist*Math.tan(fov/2);
  const worldW = worldH * camera.aspect;
  const bookW = PAGE_W*2 + 60, bookH = PAGE_H + 320;
  const s = Math.min(worldW/bookW, worldH/bookH) * 0.94;
  bookGroup.scale.set(s, s, s);
}

// ---------- 翻页 ----------
function applyPage(pts, attr, posArr, colArr, n) {
  if (n > posArr.length) {
    // 补齐
    while (posArr.length < n) { posArr.push(0,0,0); colArr.push(0,0,0); }
  }
  attr.array.set(posArr.slice(0, n*3));
  const colorAttr = pts.geometry.attributes.color;
  colorAttr.array.set(colArr.slice(0, n*3));
  attr.needsUpdate = true;
  colorAttr.needsUpdate = true;
  // 只绘制实际写入的粒子，避免 (0,0,0) 幽灵点堆积在原点
  pts.geometry.setDrawRange(0, n);
}
async function goToPage(newIndex) {
  if (busy) return;
  newIndex = clamp(newIndex, 0, TOTAL_PAIRS-1);
  if (newIndex === pageIndex) return;
  busy = true;
  const leftNo = newIndex*2+1, rightNo = newIndex*2+2;
  const [imgL, imgR] = await Promise.all([getImage(leftNo), getImage(rightNo)]);
  samplePhoto(imgL, -1, leftTo.pos, leftTo.col);
  samplePhoto(imgR, 1, rightTo.pos, rightTo.col);
  // 保存当前为目标来源
  leftFrom.pos = leftAttr.array.slice(0, leftTo.pos.length);
  leftFrom.col = leftPoints.geometry.attributes.color.array.slice(0, leftTo.col.length);
  rightFrom.pos = rightAttr.array.slice(0, rightTo.pos.length);
  rightFrom.col = rightPoints.geometry.attributes.color.array.slice(0, rightTo.col.length);
  // 补齐缺失（从零粒子开始）
  while (leftFrom.pos.length < leftTo.pos.length) { leftFrom.pos.push(0,0,0); leftFrom.col.push(0,0,0); }
  while (rightFrom.pos.length < rightTo.pos.length) { rightFrom.pos.push(0,0,0); rightFrom.col.push(0,0,0); }
  // 散开随机偏移
  animState = { t: 0, duration: 900 };
  animState.leftMid = leftTo.pos.map((v,i) => v + (Math.random()-.5)*900*(i%3===2?200:700));
  animState.rightMid = rightTo.pos.map((v,i) => v + (Math.random()-.5)*900*(i%3===2?200:700));
  animState.pageTarget = newIndex;
  pageIndex = newIndex;
  $('page-ind').textContent = `第 ${newIndex+1} / ${TOTAL_PAIRS} 页`;
}
function stepAnim(dt) {
  if (!animState) return;
  animState.t += dt;
  const p = clamp(animState.t / animState.duration, 0, 1);
  const e1 = ease(clamp(p/.5, 0, 1));       // 散开
  const e2 = ease(clamp((p-.5)/.5, 0, 1));  // 收拢
  const n = leftTo.pos.length;
  const lp = leftAttr.array, lc = leftPoints.geometry.attributes.color.array;
  const rp = rightAttr.array, rc = rightPoints.geometry.attributes.color.array;
  for (let i = 0; i < n; i++) {
    const from = leftFrom.pos[i], mid = animState.leftMid[i], to = leftTo.pos[i];
    lp[i] = p < .5 ? lerp(from, mid, e1) : lerp(mid, to, e2);
    lc[i] = lerp(leftFrom.col[i], leftTo.col[i], p);
  }
  const m = rightTo.pos.length;
  for (let i = 0; i < m; i++) {
    const from = rightFrom.pos[i], mid = animState.rightMid[i], to = rightTo.pos[i];
    rp[i] = p < .5 ? lerp(from, mid, e1) : lerp(mid, to, e2);
    rc[i] = lerp(rightFrom.col[i], rightTo.col[i], p);
  }
  leftAttr.needsUpdate = true; leftPoints.geometry.attributes.color.needsUpdate = true;
  rightAttr.needsUpdate = true; rightPoints.geometry.attributes.color.needsUpdate = true;
  if (p >= 1) {
    leftPoints.geometry.setDrawRange(0, n/3);
    rightPoints.geometry.setDrawRange(0, m/3);
    animState = null; busy = false;
  }
}

// ---------- 启动 ----------
async function start() {
  init();
  const [imgL, imgR] = await Promise.all([getImage(1), getImage(2)]);
  samplePhoto(imgL, -1, leftTo.pos, leftTo.col);
  samplePhoto(imgR, 1, rightTo.pos, rightTo.col);
  applyPage(leftPoints, leftAttr, leftTo.pos, leftTo.col, leftTo.pos.length/3);
  applyPage(rightPoints, rightAttr, rightTo.pos, rightTo.col, rightTo.pos.length/3);
  $('loading').classList.add('hidden');
  // 首次翻页按钮提示之后自动隐藏由 CSS 处理（保持显示）
}
function animate(time) {
  requestAnimationFrame(animate);
  const dt = Math.min(50, time - (animate.last || time));
  animate.last = time;
  stepAnim(dt);
  starPoints.rotation.y += 0.0004;
  bookGroup.rotation.y = Math.sin(time*0.00025)*0.07;
  controls.update();
  renderer.render(scene, camera);
}

// 点击翻页
window.addEventListener('pointerdown', (e) => {
  if (e.target && e.target.closest && e.target.closest('#loading')) return;
  if (busy) return;
  if (e.clientX > innerWidth*0.55) goToPage(pageIndex+1);
  else if (e.clientX < innerWidth*0.45) goToPage(pageIndex-1);
});
start();
})();
</script>
</body>
</html>
