<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Our Particle Memory Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #03040a; color: #fff;
  font-family: 'ZCOOL KuaiLe', 'PingFang SC', sans-serif; touch-action: none; }
#scene { position: fixed; inset: 0; }
#hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
#title { position: absolute; top: 5vh; left: 0; right: 0; text-align: center;
  font: 700 30px Caveat, cursive; color: #fff; letter-spacing: 2px; text-shadow: 0 0 18px rgba(255,255,255,.65); }
#subtitle { margin-top: 6px; font: 13px 'ZCOOL KuaiLe', sans-serif; letter-spacing: 2px; color: #cfd6ff; opacity: .75; }
#page-ind { position: absolute; top: 5vh; right: 4vw; font-size: 14px; color: #e8ecff; opacity: .8;
  background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.25); border-radius: 20px; padding: 6px 14px; }
#hint { position: absolute; bottom: 4vh; left: 0; right: 0; text-align: center; font-size: 13px; color: #cfd6ff; opacity: .7; }
#loading { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center;
  background: #03040a; transition: opacity .8s ease; }
#loading.hidden { opacity: 0; pointer-events: none; }
.load-box { width: min(84vw, 360px); padding: 28px 22px; text-align: center; border: 1px solid rgba(255,255,255,.22);
  border-radius: 24px; background: rgba(255,255,255,.06); box-shadow: 0 16px 50px rgba(0,0,0,.7); }
.load-title { font: 700 30px Caveat, cursive; color: #fff; letter-spacing: 2px; margin-bottom: 14px; text-shadow: 0 0 20px rgba(255,255,255,.8); }
.load-text { font-size: 15px; color: #dfe4ff; }
</style>
</head>
<body>
<div id="scene"></div>
<div id="hud">
  <div id="title">andy ♥ 陶陶<span id="subtitle"><br>OUR PARTICLE MEMORY BOOK</span></div>
  <div id="page-ind">第 1 / 60 页</div>
  <div id="hint">点击书页左右两侧翻页 · 拖动旋转书本</div>
</div>
<div id="loading">
  <div class="load-box">
    <div class="load-title">A book made of stardust</div>
    <div class="load-text" id="status">正在准备照片…</div>
  </div>
</div>
<script>
window.onerror = function(msg, src, line) {
  var s = document.getElementById('status');
  if (s) s.textContent = 'JS错误: ' + msg + ' @' + line;
};
window.addEventListener('unhandledrejection', function(e) {
  var s = document.getElementById('status');
  if (s) s.textContent = '异步错误: ' + e.reason;
});
(() => {
'use strict';
const PAGE_W = 470, PAGE_H = 700;          // 单页尺寸
const TOTAL_PAIRS = 60;                    // 60 页 = 120 张照片
let pageIndex = 0;                          // 0..59，显示照片 (2n+1, 2n+2)
let busy = false;

let renderer, scene, camera, controls, bookGroup, starPoints, framePoints, titlePoints;
let leftMesh, leftPivot, rightMesh, rightPivot, leftMat, rightMat, tiltGroup;

const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
const lerp = (a,b,t) => a + (b-a)*t;
const imgCache = new Map();

function getImage(index) {
  const url = `assets/images/${index}.webp`;
  if (imgCache.has(url)) return imgCache.get(url);
  const p = new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = url;
  });
  imgCache.set(url, p);
  return p;
}

// 照片 → 页面比例纹理（cover 裁切，不变形）
function makePageTexture(img) {
  const c = document.createElement('canvas');
  c.width = 512; c.height = Math.round(512 * PAGE_H / PAGE_W);
  const ctx = c.getContext('2d');
  if (img) {
    const s = Math.max(c.width / img.naturalWidth, c.height / img.naturalHeight);
    const dw = img.naturalWidth * s, dh = img.naturalHeight * s;
    ctx.drawImage(img, (c.width - dw) / 2, (c.height - dh) / 2, dw, dh);
  } else {
    ctx.fillStyle = '#1a1630'; ctx.fillRect(0, 0, c.width, c.height);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.encoding = THREE.sRGBEncoding;
  return tex;
}

// ---------- 书本结构粒子（白色） ----------
function buildFrameParticles() {
  const pos = [], col = [];
  const push = (x,y,z,c) => { pos.push(x,y,z); col.push(c,c,c); };
  const W = PAGE_W + 40, H = PAGE_H + 40, D = -52;
  // 底板边框（书皮轮廓）
  const step = 15;
  for (let x = -W/2; x <= W/2; x += step) { push(x,-H/2,D,.62); push(x,H/2,D,.62); }
  for (let y = -H/2; y <= H/2; y += step) { push(-W/2,y,D,.62); push(W/2,y,D,.62); }
  // 底板稀疏填充
  for (let x = -W/2+20; x <= W/2-20; x += 46) for (let y = -H/2+20; y <= H/2-20; y += 46)
    if (Math.random() < .28) push(x,y,D,.16);
  // 左右页边框（正面）
  for (const side of [-1,1]) {
    for (let x = 0; x <= PAGE_W; x += 13) { push(side*x, -PAGE_H/2, 1, .95); push(side*x, PAGE_H/2, 1, .95); }
    for (let y = -PAGE_H/2; y <= PAGE_H/2; y += 13) { push(side*PAGE_W, y, 1, .95); }
    // 页面厚度层
    const layers = [[-12,.58],[-26,.42],[-40,.28],[-52,.16]];
    for (const [z, c] of layers)
      for (let x = 0; x <= PAGE_W; x += 17) { push(side*x, -PAGE_H/2, z, c); push(side*x, PAGE_H/2, z, c); }
  }
  // 书脊：中缝凸起
  for (let x = -10; x <= 10; x += 4) {
    for (let y = -PAGE_H/2; y <= PAGE_H/2; y += 10) {
      push(x, y, -52 + 78*(1-(x/10)*(x/10))*.55, .98);
    }
  }
  // 书脊顶部高光列
  for (let y = -PAGE_H/2; y <= PAGE_H/2; y += 7) push(0, y, 9, 1);
  return { pos, col };
}
// ---------- 标题粒子（andy ♥ 陶陶） ----------
function buildTitleParticles() {
  const canvas = document.createElement('canvas');
  canvas.width = 360; canvas.height = 110;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#000'; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 44px "PingFang SC", "Noto Sans SC", sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('andy ♥ 陶陶', canvas.width/2, canvas.height/2);
  const data = ctx.getImageData(0,0,canvas.width,canvas.height).data;
  const pos = [], col = [];
  const TW = 280, TH = 90;
  for (let y = 0; y < canvas.height; y += 2) for (let x = 0; x < canvas.width; x += 2) {
    const i = (y*canvas.width+x)*4;
    if (data[i+3] > 120) {
      pos.push((x/canvas.width-.5)*TW, (.5-y/canvas.height)*TH + PAGE_H/2 + 150, 46);
      const b = .75 + Math.random()*.25;
      col.push(b,b,b);
    }
  }
  return { pos, col };
}

// ---------- 初始化 ----------
function init() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 1, 20000);
  camera.position.set(0, 80, 1750);
  camera.lookAt(0, 0, 0);
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  $('scene').appendChild(renderer.domElement);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 0, 0);
  controls.enableZoom = false;
  controls.enablePan = false;
  controls.minPolarAngle = 0.9;
  controls.maxPolarAngle = 1.7;
  controls.enableDamping = true;
  controls.dampingFactor = .08;
  controls.autoRotate = false;

  // 书本组：页面向上摊开（立起面向观众），保留一定透视看得到厚度与书脊
  bookGroup = new THREE.Group();
  bookGroup.rotation.x = -0.38;
  scene.add(bookGroup);
  // 翻页倾斜组（照片层）
  tiltGroup = new THREE.Group();
  bookGroup.add(tiltGroup);

  // 星空
  const starGeo = new THREE.BufferGeometry();
  const sp = new Float32Array(2200*3), sc = new Float32Array(2200*3);
  for (let i = 0; i < 2200; i++) {
    const r = 2600 + Math.random()*3600;
    const t = Math.random()*Math.PI*2, p = Math.acos(2*Math.random()-1);
    sp[i*3] = r*Math.sin(p)*Math.cos(t);
    sp[i*3+1] = r*Math.sin(p)*Math.sin(t);
    sp[i*3+2] = r*Math.cos(p);
    const b = .25 + Math.random()*.75;
    sc[i*3] = b; sc[i*3+1] = b; sc[i*3+2] = b;
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(sp,3));
  starGeo.setAttribute('color', new THREE.BufferAttribute(sc,3));
  starPoints = new THREE.Points(starGeo, new THREE.PointsMaterial({
    size: 2.4, vertexColors: true, transparent: true, opacity: .9,
    blending: THREE.AdditiveBlending, depthWrite: false }));
  scene.add(starPoints);

  // 结构粒子
  const fp = buildFrameParticles();
  const fGeo = new THREE.BufferGeometry();
  fGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(fp.pos),3));
  fGeo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(fp.col),3));
  framePoints = new THREE.Points(fGeo, new THREE.PointsMaterial({
    size: 4.2, vertexColors: true, transparent: true, opacity: .95,
    blending: THREE.AdditiveBlending, depthWrite: false }));
  bookGroup.add(framePoints);

  // 左右照片平面（清晰贴图）
  const pageGeo = new THREE.PlaneGeometry(PAGE_W, PAGE_H);
  leftMat = new THREE.MeshBasicMaterial({ map: null, transparent: true, opacity: 1, depthWrite: false, side: THREE.DoubleSide });
  rightMat = new THREE.MeshBasicMaterial({ map: null, transparent: true, opacity: 1, depthWrite: false, side: THREE.DoubleSide });
  leftMesh = new THREE.Mesh(pageGeo, leftMat);
  leftPivot = new THREE.Group();
  leftPivot.position.set(0, 0, 0);
  leftMesh.position.set(-PAGE_W/2, 0, -1);
  leftPivot.add(leftMesh);
  rightPivot = new THREE.Group();
  rightPivot.position.set(0, 0, 0);
  rightMesh = new THREE.Mesh(pageGeo, rightMat);
  rightMesh.position.set(PAGE_W/2, 0, -1);
  rightPivot.add(rightMesh);
  tiltGroup.add(leftPivot);
  tiltGroup.add(rightPivot);

  // 标题粒子
  const tp = buildTitleParticles();
  const tGeo = new THREE.BufferGeometry();
  tGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(tp.pos),3));
  tGeo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(tp.col),3));
  titlePoints = new THREE.Points(tGeo, new THREE.PointsMaterial({
    size: 5.6, vertexColors: true, transparent: true, opacity: 1,
    blending: THREE.AdditiveBlending, depthWrite: false }));
  bookGroup.add(titlePoints);

  window.addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    fitBook();
  });
  fitBook();
  animate();
}
function fitBook() {
  const fov = camera.fov*Math.PI/180;
  const dist = camera.position.length();
  const worldH = 2*dist*Math.tan(fov/2);
  const worldW = worldH * camera.aspect;
  const bookW = PAGE_W*2 + 60, bookH = PAGE_H + 320;
  const s = Math.min(worldW/bookW, worldH/bookH) * 0.94;
  bookGroup.scale.set(s, s, s);
}

// ---------- 翻页（淡入淡出 + 轻微倾翻） ----------
function animateValue(duration, onUpdate, onDone) {
  const t0 = performance.now();
  function frame(now) {
    const p = clamp((now - t0) / duration, 0, 1);
    onUpdate(ease(p));
    if (p < 1) requestAnimationFrame(frame);
    else if (onDone) onDone();
  }
  requestAnimationFrame(frame);
}
async function goToPage(newIndex) {
  if (busy) return;
  newIndex = clamp(newIndex, 0, TOTAL_PAIRS-1);
  if (newIndex === pageIndex) return;
  busy = true;
  const forward = newIndex > pageIndex;
  const leftNo = newIndex*2+1, rightNo = newIndex*2+2;
  const [imgL, imgR] = await Promise.all([getImage(leftNo), getImage(rightNo)]);
  const texL = makePageTexture(imgL), texR = makePageTexture(imgR);
  const oldL = leftMat.map, oldR = rightMat.map;
  if (forward) {
    // 下一页：右页绕书脊从右往左翻越
    let swapped = false;
    await new Promise(res => animateValue(700, p => {
      rightPivot.rotation.y = -Math.PI * p;
      if (p >= 0.5 && !swapped) {
        swapped = true;
        leftMat.map = texL; leftMat.needsUpdate = true;
        if (oldL) oldL.dispose();
      }
    }, res));
    rightPivot.rotation.y = 0;
    rightMat.map = texR; rightMat.needsUpdate = true;
  } else {
    // 上一页：左页绕书脊从左往右翻回
    let swapped = false;
    await new Promise(res => animateValue(700, p => {
      leftPivot.rotation.y = Math.PI * p;
      if (p >= 0.5 && !swapped) {
        swapped = true;
        rightMat.map = texR; rightMat.needsUpdate = true;
        if (oldR) oldR.dispose();
      }
    }, res));
    leftPivot.rotation.y = 0;
    leftMat.map = texL; leftMat.needsUpdate = true;
  }
  if (oldL && oldL !== texL && leftMat.map !== oldL) oldL.dispose();
  if (oldR && oldR !== texR && rightMat.map !== oldR) oldR.dispose();
  pageIndex = newIndex;
  $('page-ind').textContent = `第 ${newIndex+1} / ${TOTAL_PAIRS} 页`;
  busy = false;
  preloadNeighbors(newIndex);
}
function preloadNeighbors(index) {
  // 预加载相邻两页，点击翻页时照片已就绪，不再等待
  for (const n of [index-1, index+1]) {
    if (n < 0 || n >= TOTAL_PAIRS) continue;
    getImage(n*2+1);
    getImage(n*2+2);
  }
}

// ---------- 启动 ----------
async function start() {
  init();
  const [imgL, imgR] = await Promise.all([getImage(1), getImage(2)]);
  leftMat.map = makePageTexture(imgL);
  rightMat.map = makePageTexture(imgR);
  leftMat.needsUpdate = true;
  rightMat.needsUpdate = true;
  preloadNeighbors(0);
  $('loading').classList.add('hidden');
}
function animate(time) {
  requestAnimationFrame(animate);
  starPoints.rotation.y += 0.0004;
  bookGroup.rotation.y = Math.sin(time*0.00025)*0.07;
  controls.update();
  renderer.render(scene, camera);
}

// 点击翻页：右侧下一页，左侧上一页
window.addEventListener('pointerdown', (e) => {
  if (e.target && e.target.closest && e.target.closest('#loading')) return;
  if (busy) return;
  if (e.clientX > innerWidth*0.55) goToPage(pageIndex+1);
  else if (e.clientX < innerWidth*0.45) goToPage(pageIndex-1);
});
start();
})();
</script>
</body>
</html>
