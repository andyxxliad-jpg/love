<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Our Particle Memory Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/renderers/CSS3DRenderer.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #03040a; color: #fff;
  font-family: 'ZCOOL KuaiLe', 'PingFang SC', sans-serif; touch-action: none; }
#webgl { position: fixed; inset: 0; z-index: 0; }
#css { position: absolute; inset: 0; z-index: 1; }
#hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
#title { position: absolute; top: 4vh; left: 0; right: 0; text-align: center;
  font: 700 30px Caveat, cursive; color: #fff; letter-spacing: 2px; text-shadow: 0 0 18px rgba(255,255,255,.65); }
#subtitle { margin-top: 4px; font: 12px 'ZCOOL KuaiLe', sans-serif; letter-spacing: 2px; color: #cfd6ff; opacity: .7; }
#page-ind { position: absolute; top: 4vh; right: 4vw; font-size: 14px; color: #e8ecff;
  background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.25); border-radius: 20px; padding: 6px 14px; }
#hint { position: absolute; bottom: 3.5vh; left: 0; right: 0; text-align: center; font-size: 13px; color: #cfd6ff; opacity: .65; }
#loading { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center;
  background: #03040a; transition: opacity .8s ease; }
#loading.hidden { opacity: 0; pointer-events: none; }
.load-box { width: min(84vw, 360px); padding: 28px 22px; text-align: center; border: 1px solid rgba(255,255,255,.22);
  border-radius: 24px; background: rgba(255,255,255,.06); box-shadow: 0 16px 50px rgba(0,0,0,.7); }
.load-title { font: 700 30px Caveat, cursive; color: #fff; letter-spacing: 2px; margin-bottom: 14px; text-shadow: 0 0 20px rgba(255,255,255,.8); }
.load-text { font-size: 15px; color: #dfe4ff; }
.bar { height: 7px; margin: 18px 0 8px; border-radius: 8px; background: rgba(255,255,255,.15); overflow: hidden; }
.bar i { display: block; width: 0; height: 100%; background: linear-gradient(90deg,#e8ecff,#fff); box-shadow: 0 0 14px #fff; border-radius: inherit; transition: width .25s; }
.load-count { font-size: 12px; color: #aab2d8; }
/* CSS3D 部件 */
.book-paper { position: relative; background: #f6f1e6; border-radius: 4px 10px 10px 4px;
  box-shadow: inset 0 0 24px rgba(130,105,80,.22), 0 0 12px rgba(0,0,0,.45);
  overflow: hidden; }
.book-paper.right { border-radius: 10px 4px 4px 10px; }
.book-photo { position: relative; border-radius: 8px; overflow: hidden; cursor: pointer;
  border: 3px solid rgba(255,255,255,.85);
  box-shadow: 0 8px 24px rgba(0,0,0,.6), 0 0 20px rgba(255,150,190,.45);
  background-size: cover; background-position: center; background-color: #241625;
  will-change: transform; backface-visibility: visible; -webkit-backface-visibility: visible;
  user-select: none; -webkit-user-select: none; -webkit-user-drag: none; }
#photo-modal { display: none; position: fixed; z-index: 50; inset: 0; background: rgba(0,0,0,.85); align-items: center; justify-content: center; }
#photo-modal.show { display: flex; }
#photo-modal img { max-width: 88vw; max-height: 80vh; border-radius: 12px; border: 3px solid rgba(255,182,193,.8); box-shadow: 0 0 30px rgba(0,0,0,.9); }
</style>
</head>
<body>
<div id="webgl"></div>
<div id="css"></div>
<div id="hud">
  <div id="title">andy ♥ 陶陶<span id="subtitle"><br>OUR PARTICLE MEMORY BOOK</span></div>
  <div id="page-ind">第 1 / 5 页</div>
  <div id="hint">点击屏幕左右两侧翻页 · 拖动旋转书本 · 双指缩放看整摞书</div>
</div>
<div id="loading">
  <div class="load-box">
    <div class="load-title">A book made of stardust</div>
    <div class="load-text" id="status">正在准备照片…</div>
    <div class="bar"><i id="progress"></i></div>
    <div class="load-count" id="count">照片准备中 0 / 10</div>
  </div>
</div>
<div id="photo-modal"><img id="photo-large" src="" alt=""></div>
<script>
window.onerror = function(msg, src, line) {
  var s = document.getElementById('status');
  if (s) s.textContent = 'JS错误: ' + msg + ' @' + line;
};
(() => {
'use strict';
const PAGE_W = 330, PAGE_H = 440;
const TOTAL_PAGES = 5;          // 5 页纸常驻
let pageIndex = 0;              // 0..4，当前跨页 = 照片 (2n+1, 2n+2)
let busy = false;

let sceneWebGL, sceneCSS, camera, rendererWebGL, rendererCSS, controls, particles;
let bookGroup, leftTopPivot, rightTopPivot, leftStackGroup, rightStackGroup;
let framePoints, frameBase = [], framePhase = [], frameAmp = [];
let stackItems = [];            // 堆层 {group, paper, photo, photoBack, index}

const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
const imgCache = new Map();
function getImage(index) {
  const url = `assets/images/${index}.webp`;
  if (imgCache.has(url)) return imgCache.get(url);
  const p = new Promise(resolve => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = url;
  });
  imgCache.set(url, p);
  return p;
}

// ---------- 白色粒子结构（书皮 V 形、书脊、页面边框，呼吸+浮动） ----------
function buildFrameParticles() {
  const pos = [], col = [];
  const jit = () => (Math.random()-.5)*9;
  const push = (x,y,z,c) => {
    pos.push(x+jit(), y+jit(), z+jit()*.6);
    col.push(c,c,c);
    framePhase.push(Math.random()*Math.PI*2);
    frameAmp.push(1.2+Math.random()*3.2);
  };
  const W = PAGE_W+46, H = PAGE_H+46, D = -64;
  const vLift = 0.24;
  // 书皮底板（两半 V 形）
  for (let x = -W/2; x <= W/2; x += 8) {
    const z = D + Math.abs(x)*vLift;
    push(x, -H/2, z, .7); push(x, H/2, z, .7);
  }
  for (let y = -H/2; y <= H/2; y += 8) {
    push(-W/2, y, D+(W/2)*vLift, .7); push(W/2, y, D+(W/2)*vLift, .7);
  }
  // 左右当前页边框
  for (const side of [-1,1]) {
    for (let x = 0; x <= PAGE_W; x += 8) {
      push(side*x, -PAGE_H/2, 1, .95); push(side*x, PAGE_H/2, 1, .95);
    }
    for (let y = -PAGE_H/2; y <= PAGE_H/2; y += 8) push(side*PAGE_W, y, 1, .95);
  }
  // 页面堆厚度：右侧堆 4 层 + 左侧堆 4 层的页边（白色粒子，随层数错开）
  for (let k = 1; k <= 4; k++) {
    const z = -4 - k*5;
    // 右侧堆页边
    for (let y = -PAGE_H/2; y <= PAGE_H/2; y += 10) {
      push(PAGE_W + k*2, y, z, .45);
      push(-PAGE_W - k*2, y, z, .45);
    }
  }
  // 书脊凸起
  for (let x = -10; x <= 10; x += 3) {
    for (let y = -PAGE_H/2; y <= PAGE_H/2; y += 7) {
      push(x, y, -56 + 80*(1-(x/10)*(x/10))*.6, .98);
    }
  }
  for (let y = -PAGE_H/2; y <= PAGE_H/2; y += 5) push(0, y, 10, 1);
  return { pos, col };
}

function makeDiv(className, w, h) {
  const d = document.createElement('div');
  d.className = className;
  d.style.width = w+'px';
  d.style.height = h+'px';
  return d;
}
function cssObject(el, x, y, z) {
  const o = new THREE.CSS3DObject(el);
  o.position.set(x, y, z);
  return o;
}
// 创建一张纸页（纸板 + 正反两张照片卡片）
function makeSheet() {
  const group = new THREE.Group();
  group.rotation.order = 'YXZ';
  const paper = cssObject(makeDiv('book-paper', PAGE_W, PAGE_H), 0, 0, 0);
  const phW = PAGE_W-56, phH = PAGE_H-76;
  const photo = cssObject(makeDiv('book-photo', phW, phH), 0, 4, 12);
  const photoBack = cssObject(makeDiv('book-photo', phW, phH), 0, 4, 12);
  photoBack.rotation.y = Math.PI;
  group.add(paper, photo, photoBack);
  return { group, paper, photo, photoBack };
}
function setSheetPhoto(sheet, index) {
  const url = `assets/images/${index}.webp`;
  sheet.photo.element.style.backgroundImage = `url('${url}')`;
  sheet.photoBack.element.style.backgroundImage = `url('${url}')`;
  sheet.photo.element.dataset.photo = index;
}

function init() {
  camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 1, 14000);
  camera.position.set(0, 120, 2150);
  camera.lookAt(0, 0, 0);

  sceneWebGL = new THREE.Scene();
  const n = innerWidth <= 768 ? 1200 : 2000;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(n*3);
  for (let i = 0; i < n*3; i++) pos[i] = (Math.random()-.5)*5200;
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const cv = document.createElement('canvas'); cv.width = 64; cv.height = 64;
  const c2 = cv.getContext('2d');
  const g = c2.createRadialGradient(32,32,0,32,32,32);
  g.addColorStop(0,'rgba(255,255,255,1)');
  g.addColorStop(.25,'rgba(255,182,193,1)');
  g.addColorStop(1,'rgba(0,0,0,0)');
  c2.fillStyle = g; c2.fillRect(0,0,64,64);
  particles = new THREE.Points(geo, new THREE.PointsMaterial({
    size: 40, map: new THREE.CanvasTexture(cv), transparent: true, opacity: .95,
    blending: THREE.AdditiveBlending, depthWrite: false }));
  sceneWebGL.add(particles);
  rendererWebGL = new THREE.WebGLRenderer({ alpha: true, antialias: window.devicePixelRatio < 2 });
  rendererWebGL.setSize(innerWidth, innerHeight);
  $('webgl').appendChild(rendererWebGL.domElement);

  // 白色粒子结构
  const fp = buildFrameParticles();
  frameBase = fp.pos;
  const fGeo = new THREE.BufferGeometry();
  fGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(fp.pos),3));
  fGeo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(fp.col),3));
  framePoints = new THREE.Points(fGeo, new THREE.PointsMaterial({
    size: 4.2, vertexColors: true, transparent: true, opacity: .9,
    blending: THREE.AdditiveBlending, depthWrite: false }));
  sceneWebGL.add(framePoints);

  // 书本 CSS3D
  sceneCSS = new THREE.Scene();
  bookGroup = new THREE.Group();
  bookGroup.rotation.x = -0.12;
  sceneCSS.add(bookGroup);

  // 当前左右页
  leftTopPivot = makeSheet();
  rightTopPivot = makeSheet();
  leftTopPivot.group.position.set(-PAGE_W/2, 0, 0);
  rightTopPivot.group.position.set(PAGE_W/2, 0, 0);
  bookGroup.add(leftTopPivot.group, rightTopPivot.group);

  // 左右堆（常驻的其余页）
  leftStackGroup = new THREE.Group();
  rightStackGroup = new THREE.Group();
  bookGroup.add(leftStackGroup, rightStackGroup);
  for (let k = 0; k < TOTAL_PAGES-1; k++) {
    const sL = makeSheet();
    sL.group.position.set(-PAGE_W/2 - (k+1)*3, 0, -6 - k*6);
    leftStackGroup.add(sL.group);
    const sR = makeSheet();
    sR.group.position.set(PAGE_W/2 + (k+1)*3, 0, -6 - k*6);
    rightStackGroup.add(sR.group);
    stackItems.push({ left: sL, right: sR, k });
  }

  rendererCSS = new THREE.CSS3DRenderer();
  rendererCSS.setSize(innerWidth, innerHeight);
  rendererCSS.domElement.style.position = 'absolute';
  rendererCSS.domElement.style.top = '0';
  $('css').appendChild(rendererCSS.domElement);

  controls = new THREE.OrbitControls(camera, rendererCSS.domElement);
  controls.minDistance = 500;
  controls.maxDistance = 9000;
  controls.enablePan = true;
  controls.enableZoom = true;
  controls.enableDamping = true;
  controls.dampingFactor = .06;

  window.addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    rendererWebGL.setSize(innerWidth, innerHeight);
    rendererCSS.setSize(innerWidth, innerHeight);
    fitBook();
  });
  fitBook();
  animate();
}
function fitBook() {
  const fov = camera.fov*Math.PI/180;
  const dist = camera.position.length();
  const worldH = 2*dist*Math.tan(fov/2);
  const worldW = worldH * camera.aspect;
  const s = Math.min(worldW/(PAGE_W*2+180), worldH/(PAGE_H+180)) * 0.92;
  bookGroup.scale.set(s, s, s);
}

// 更新所有页的照片归属（当前页 + 堆层）
function layoutPhotos() {
  setSheetPhoto(leftTopPivot, pageIndex*2+1);
  setSheetPhoto(rightTopPivot, pageIndex*2+2);
  stackItems.forEach((item, k) => {
    const leftNo = pageIndex*2+2 + k*2 + 1;   // 左侧堆是更早的照片
    const rightNo = pageIndex*2+2 + k*2 + 2;  // 右侧堆是更晚的照片
    if (leftNo <= 10) setSheetPhoto(item.left, Math.max(1, leftNo));
    if (rightNo <= 10) setSheetPhoto(item.right, Math.min(10, Math.max(1, rightNo)));
  });
  // 堆层数：左堆 pageIndex 层、右堆 TOTAL_PAGES-1-pageIndex 层
  stackItems.forEach((item, k) => {
    item.left.group.visible = k < pageIndex;
    item.right.group.visible = k < (TOTAL_PAGES-1-pageIndex);
  });
}

function animateValue(duration, onUpdate, onDone) {
  const t0 = performance.now();
  const timer = setInterval(() => {
    const p = clamp((performance.now()-t0)/duration, 0, 1);
    onUpdate(ease(p));
    if (p >= 1) { clearInterval(timer); if (onDone) onDone(); }
  }, 16);
}
async function goToPage(newIndex) {
  if (busy) return;
  newIndex = clamp(newIndex, 0, TOTAL_PAGES-1);
  if (newIndex === pageIndex) return;
  busy = true;
  const forward = newIndex > pageIndex;
  const safety = setTimeout(() => { busy = false; leftTopPivot.group.rotation.y = 0; rightTopPivot.group.rotation.y = 0; }, 3000);
  const leftNo = newIndex*2+1, rightNo = newIndex*2+2;
  await Promise.all([getImage(leftNo), getImage(rightNo)]);
  if (forward) {
    // 右页带照片从右往左翻越，翻越中露出新左页
    setSheetPhoto(rightTopPivot, rightNo);
    let swapped = false;
    await new Promise(res => animateValue(650, p => {
      rightTopPivot.group.rotation.y = -Math.PI*p;
      if (p >= .5 && !swapped) {
        swapped = true;
        setSheetPhoto(leftTopPivot, leftNo);
        layoutPhotos();
      }
    }, res));
    rightTopPivot.group.rotation.y = 0;
    setSheetPhoto(rightTopPivot, rightNo);
  } else {
    setSheetPhoto(leftTopPivot, leftNo);
    let swapped = false;
    await new Promise(res => animateValue(650, p => {
      leftTopPivot.group.rotation.y = Math.PI*p;
      if (p >= .5 && !swapped) {
        swapped = true;
        setSheetPhoto(rightTopPivot, rightNo);
        layoutPhotos();
      }
    }, res));
    leftTopPivot.group.rotation.y = 0;
    setSheetPhoto(leftTopPivot, leftNo);
  }
  clearTimeout(safety);
  pageIndex = newIndex;
  layoutPhotos();
  $('page-ind').textContent = `第 ${newIndex+1} / ${TOTAL_PAGES} 页`;
  busy = false;
}

function animate() {
  requestAnimationFrame(animate);
  const t = performance.now()*0.001;
  // 粒子浮动
  const fa = framePoints.geometry.attributes.position;
  for (let i = 0; i < framePhase.length; i++) {
    const k = i*3;
    fa.array[k] = frameBase[k] + Math.sin(t*1.1+framePhase[i])*frameAmp[i]*.5;
    fa.array[k+1] = frameBase[k+1] + Math.cos(t*.9+framePhase[i])*frameAmp[i]*.4;
    fa.array[k+2] = frameBase[k+2] + Math.sin(t*.8+framePhase[i]*1.7)*frameAmp[i]*.25;
  }
  fa.needsUpdate = true;
  // 呼吸发光
  framePoints.material.opacity = .76 + Math.sin(t*1.4)*.24;
  if (particles) {
    particles.rotation.y += .0008;
    particles.rotation.x += .0004;
  }
  controls.update();
  rendererWebGL.render(sceneWebGL, camera);
  rendererCSS.render(sceneCSS, camera);
}

async function preloadPhotos() {
  const TOTAL = 10;
  let done = 0;
  await Promise.all(Array.from({length: TOTAL}, (_, i) => getImage(i+1).then(() => {
    done++;
    $('progress').style.width = Math.round(done/TOTAL*100) + '%';
    $('count').textContent = `照片准备中 ${done} / ${TOTAL}`;
    if (done >= TOTAL) {
      $('status').textContent = '照片准备完成';
      setTimeout(() => $('loading').classList.add('hidden'), 400);
    }
  })));
}

init();
preloadPhotos();
layoutPhotos();

window.addEventListener('pointerdown', (e) => {
  if (e.target && e.target.closest && e.target.closest('#loading')) return;
  if (e.target.closest && e.target.closest('#photo-modal')) return;
  if (busy) return;
  if (e.clientX > innerWidth*0.55) goToPage(pageIndex+1);
  else if (e.clientX < innerWidth*0.45) goToPage(pageIndex-1);
});
document.addEventListener('pointerup', (e) => {
  const el = e.target.closest && e.target.closest('.book-photo');
  if (el && el.dataset.photo) {
    $('photo-large').src = `assets/images/${el.dataset.photo}.webp`;
    $('photo-modal').classList.add('show');
  }
});
$('photo-modal').addEventListener('click', () => $('photo-modal').classList.remove('show'));
})();
</script>
</body>
</html>
