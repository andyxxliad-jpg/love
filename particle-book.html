<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Our Particle Memory Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/renderers/CSS3DRenderer.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #03040a; color: #fff;
  font-family: 'ZCOOL KuaiLe', 'PingFang SC', sans-serif; touch-action: none; }
#webgl { position: fixed; inset: 0; z-index: 0; }
#css { position: absolute; inset: 0; z-index: 1; }
#hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
#title { position: absolute; top: 4vh; left: 0; right: 0; text-align: center;
  font: 700 30px Caveat, cursive; color: #fff; letter-spacing: 2px; text-shadow: 0 0 18px rgba(255,255,255,.65); }
#subtitle { margin-top: 4px; font: 12px 'ZCOOL KuaiLe', sans-serif; letter-spacing: 2px; color: #cfd6ff; opacity: .7; }
#page-ind { position: absolute; top: 4vh; right: 4vw; font-size: 14px; color: #e8ecff;
  background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.25); border-radius: 20px; padding: 6px 14px; }
#hint { position: absolute; bottom: 3.5vh; left: 0; right: 0; text-align: center; font-size: 13px; color: #cfd6ff; opacity: .65; }
.book-paper { position: relative; background: #1c1322; border-radius: 4px 10px 10px 4px;
  box-shadow: inset 0 0 18px rgba(120,90,140,.25), 0 0 10px rgba(0,0,0,.5); }
.book-paper.right { border-radius: 10px 4px 4px 10px; }
</style>
</head>
<body>
<div id="webgl"></div>
<div id="css"></div>
<div id="hud">
  <div id="title">andy ♥ 陶陶<span id="subtitle"><br>OUR PARTICLE MEMORY BOOK</span></div>
  <div id="page-ind">第 1 / 5 页</div>
  <div id="hint">点击屏幕左右两侧翻页 · 拖动旋转书本</div>
</div>
<script>
window.onerror = function(msg, src, line) {
  console.error(msg, line);
};
(() => {
'use strict';
const PAGE_W = 340, PAGE_H = 460;
const TOTAL_PAGES = 5;
let pageIndex = 0;
let busy = false;

let sceneWebGL, sceneCSS, camera, rendererWebGL, rendererCSS, controls, particles;
let cssBookGroup, webglBookGroup, leftPivot, rightPivot, leftStackGroup, rightStackGroup;
let framePoints, textPoints, starPoints;
let frameBase = [], framePhase = [], frameAmp = [];
const stackItems = [];

const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;

// 5 段文字
const PAGES_TEXT = [
  '我以前确实是一个很烂的人，但是遇到你之后，我发现我和以前不一样了。',
  '我想给你我的全部，我想我的生活里都是你。我可以为了你改掉我的所有不好，我真的好喜欢你。',
  '我不想和你分手，可能你会介意我的过去，以前的事我没法改变，我只能做好现在，在我们的感情里好好对你。',
  '其实我很怕，我怕你突然不喜欢我了，我怕你有了别人，我怕我嘴笨说错话让你不开心。',
  '有时候我也不知道我该怎么办，我只是想和你好好谈恋爱，我只是想让你是真的喜欢我，其他的我不奢求。'
];

// ---------- 白色粒子书结构 ----------
function buildFrameParticles() {
  const pos = [], col = [];
  const jit = () => (Math.random()-.5)*9;
  const push = (x,y,z,c) => {
    pos.push(x+jit(), y+jit(), z+jit()*.6);
    col.push(c,c,c);
    framePhase.push(Math.random()*Math.PI*2);
    frameAmp.push(1.2+Math.random()*3.2);
  };
  const W = PAGE_W+46, H = PAGE_H+46, D = -64;
  const vLift = 0.24;
  for (let x = -W/2; x <= W/2; x += 8) {
    const z = D + Math.abs(x)*vLift;
    push(x, -H/2, z, .7); push(x, H/2, z, .7);
  }
  for (let y = -H/2; y <= H/2; y += 8) {
    push(-W/2, y, D+(W/2)*vLift, .7); push(W/2, y, D+(W/2)*vLift, .7);
  }
  for (const side of [-1,1]) {
    for (let x = 0; x <= PAGE_W; x += 8) {
      push(side*x, -PAGE_H/2, 1, .95); push(side*x, PAGE_H/2, 1, .95);
    }
    for (let y = -PAGE_H/2; y <= PAGE_H/2; y += 8) push(side*PAGE_W, y, 1, .95);
  }
  for (let k = 1; k <= 4; k++) {
    const z = -4 - k*5;
    for (let y = -PAGE_H/2; y <= PAGE_H/2; y += 10) {
      push(PAGE_W + k*2, y, z, .45);
      push(-PAGE_W - k*2, y, z, .45);
    }
  }
  for (let x = -10; x <= 10; x += 3) {
    for (let y = -PAGE_H/2; y <= PAGE_H/2; y += 7) {
      push(x, y, -56 + 80*(1-(x/10)*(x/10))*.6, .98);
    }
  }
  for (let y = -PAGE_H/2; y <= PAGE_H/2; y += 5) push(0, y, 10, 1);
  return { pos, col };
}

// ---------- 文字 → 粒子 ----------
const MAX_TEXT_PARTICLES = 4200;
let textTargets = [];        // 当前文字粒子目标（局部坐标，左页区域）
let textCurrent = [];        // 当前显示位置
function wrapText(text, maxChars) {
  const lines = [];
  let line = '';
  for (const ch of text) {
    line += ch;
    if (line.length >= maxChars) { lines.push(line); line = ''; }
  }
  if (line) lines.push(line);
  return lines;
}
function buildTextParticles(text) {
  // 画布排版，采样像素成粒子
  const CW = 560, CH = 760;
  const canvas = document.createElement('canvas');
  canvas.width = CW; canvas.height = CH;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#000';
  ctx.fillRect(0,0,CW,CH);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 46px "PingFang SC", "Noto Sans SC", sans-serif';
  ctx.textBaseline = 'middle';
  const lines = wrapText(text, 8);
  const lineH = 78;
  const startY = CH/2 - (lines.length-1)*lineH/2;
  lines.forEach((line, i) => {
    ctx.fillText(line, CW/2, startY + i*lineH);
  });
  const data = ctx.getImageData(0,0,CW,CH).data;
  const pts = [];
  const step = 2;
  for (let y = 0; y < CH; y += step) for (let x = 0; x < CW; x += step) {
    const i = (y*CW+x)*4;
    // 只取白色文字笔画（黑底不算）
    if (data[i] > 150 && data[i+1] > 150 && data[i+2] > 150) {
      // 映射到左页区域（x ∈ [-PAGE_W, 0]）
      const px = (x/CW - .5) * (PAGE_W - 30);
      const py = (.5 - y/CH) * (PAGE_H - 30);
      pts.push(px - PAGE_W/2, py, (Math.random()-.5)*3);
    }
  }
  if (pts.length/3 > MAX_TEXT_PARTICLES) {
    // 均匀抽稀
    const keep = MAX_TEXT_PARTICLES;
    const total = pts.length/3;
    const ratio = keep/total;
    const picked = [];
    for (let i = 0; i < total; i++) {
      if (Math.random() < ratio) picked.push(pts[i*3], pts[i*3+1], pts[i*3+2]);
    }
    return picked;
  }
  return pts;
}

function makeDiv(className, w, h) {
  const d = document.createElement('div');
  d.className = className;
  d.style.width = w+'px';
  d.style.height = h+'px';
  return d;
}
function cssObject(el, x, y, z) {
  const o = new THREE.CSS3DObject(el);
  o.position.set(x, y, z);
  return o;
}
function makeStackBoard(right) {
  const group = new THREE.Group();
  const paper = cssObject(makeDiv(right ? 'book-paper right' : 'book-paper', PAGE_W, PAGE_H), 0, 0, 0);
  group.add(paper);
  return { group, paper };
}

// ---------- 初始化 ----------
function init() {
  camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 1, 14000);
  camera.position.set(0, 130, 2150);
  camera.lookAt(0, 0, 0);

  sceneWebGL = new THREE.Scene();
  // 星空
  const n = innerWidth <= 768 ? 1200 : 2000;
  const sGeo = new THREE.BufferGeometry();
  const sp = new Float32Array(n*3), sc = new Float32Array(n*3);
  for (let i = 0; i < n; i++) {
    const r = 2600 + Math.random()*3600;
    const t = Math.random()*Math.PI*2, p = Math.acos(2*Math.random()-1);
    sp[i*3] = r*Math.sin(p)*Math.cos(t);
    sp[i*3+1] = r*Math.sin(p)*Math.sin(t);
    sp[i*3+2] = r*Math.cos(p);
    const b = .25+Math.random()*.75;
    sc[i*3]=b; sc[i*3+1]=b; sc[i*3+2]=b;
  }
  sGeo.setAttribute('position', new THREE.BufferAttribute(sp,3));
  sGeo.setAttribute('color', new THREE.BufferAttribute(sc,3));
  starPoints = new THREE.Points(sGeo, new THREE.PointsMaterial({
    size: 2.4, vertexColors: true, transparent: true, opacity: .9,
    blending: THREE.AdditiveBlending, depthWrite: false }));
  sceneWebGL.add(starPoints);

  // 粒子书结构（挂在 WebGL 书本组，随书本缩放姿态）
  const fp = buildFrameParticles();
  frameBase = fp.pos;
  const fGeo = new THREE.BufferGeometry();
  const fInit = new Float32Array(fp.pos.length);
  for (let i = 0; i < fp.pos.length; i++) {
    fInit[i] = fp.pos[i] + (Math.random()-.5)*2200;
  }
  fGeo.setAttribute('position', new THREE.BufferAttribute(fInit,3));
  fGeo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(fp.col),3));
  framePoints = new THREE.Points(fGeo, new THREE.PointsMaterial({
    size: 4.2, vertexColors: true, transparent: true, opacity: .9,
    blending: THREE.AdditiveBlending, depthWrite: false }));

  // 文字粒子（左页）
  const tGeo = new THREE.BufferGeometry();
  const tPos = new Float32Array(MAX_TEXT_PARTICLES*3);
  const tCol = new Float32Array(MAX_TEXT_PARTICLES*3);
  for (let i = 0; i < MAX_TEXT_PARTICLES*3; i += 3) {
    tPos[i] = (Math.random()-.5)*3000;
    tPos[i+1] = (Math.random()-.5)*3000;
    tPos[i+2] = (Math.random()-.5)*2000;
  }
  for (let i = 0; i < MAX_TEXT_PARTICLES; i++) tCol[i*3] = tCol[i*3+1] = tCol[i*3+2] = 1;
  tGeo.setAttribute('position', new THREE.BufferAttribute(tPos,3));
  tGeo.setAttribute('color', new THREE.BufferAttribute(tCol,3));
  textPoints = new THREE.Points(tGeo, new THREE.PointsMaterial({
    size: 4.6, vertexColors: true, transparent: true, opacity: 1,
    blending: THREE.AdditiveBlending, depthWrite: false }));

  // WebGL 书本组（粒子挂这里，与 CSS3D 书本保持相同变换）
  webglBookGroup = new THREE.Group();
  webglBookGroup.rotation.x = -0.12;
  webglBookGroup.add(framePoints, textPoints);
  sceneWebGL.add(webglBookGroup);

  rendererWebGL = new THREE.WebGLRenderer({ alpha: true, antialias: window.devicePixelRatio < 2 });
  rendererWebGL.setSize(innerWidth, innerHeight);
  $('webgl').appendChild(rendererWebGL.domElement);

  // 书本 CSS3D（纸板堆）
  sceneCSS = new THREE.Scene();
  cssBookGroup = new THREE.Group();
  cssBookGroup.rotation.x = -0.12;
  sceneCSS.add(cssBookGroup);

  leftPivot = new THREE.Group();
  rightPivot = new THREE.Group();
  leftPivot.rotation.order = 'YXZ';
  rightPivot.rotation.order = 'YXZ';
  cssBookGroup.add(leftPivot, rightPivot);

  leftStackGroup = new THREE.Group();
  rightStackGroup = new THREE.Group();
  cssBookGroup.add(leftStackGroup, rightStackGroup);
  for (let k = 0; k < TOTAL_PAGES-1; k++) {
    const sL = makeStackBoard(false);
    sL.group.position.set(-PAGE_W/2 - (k+1)*3, 0, -6 - k*6);
    leftStackGroup.add(sL.group);
    const sR = makeStackBoard(true);
    sR.group.position.set(PAGE_W/2 + (k+1)*3, 0, -6 - k*6);
    rightStackGroup.add(sR.group);
    stackItems.push({ left: sL, right: sR, k });
  }
  layoutStacks();

  rendererCSS = new THREE.CSS3DRenderer();
  rendererCSS.setSize(innerWidth, innerHeight);
  rendererCSS.domElement.style.position = 'absolute';
  rendererCSS.domElement.style.top = '0';
  $('css').appendChild(rendererCSS.domElement);

  controls = new THREE.OrbitControls(camera, rendererCSS.domElement);
  controls.minDistance = 500;
  controls.maxDistance = 9000;
  controls.enablePan = true;
  controls.enableZoom = true;
  controls.enableDamping = true;
  controls.dampingFactor = .06;

  window.addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    rendererWebGL.setSize(innerWidth, innerHeight);
    rendererCSS.setSize(innerWidth, innerHeight);
    fitBook();
  });
  fitBook();
  animate();
}
function fitBook() {
  const fov = camera.fov*Math.PI/180;
  const dist = camera.position.length();
  const worldH = 2*dist*Math.tan(fov/2);
  const worldW = worldH * camera.aspect;
  const s = Math.min(worldW/(PAGE_W*2+180), worldH/(PAGE_H+180)) * 0.92;
  cssBookGroup.scale.set(s, s, s);
  webglBookGroup.scale.set(s, s, s);
}
function layoutStacks() {
  stackItems.forEach((item, k) => {
    item.left.group.visible = k < pageIndex;
    item.right.group.visible = k < (TOTAL_PAGES-1-pageIndex);
  });
}

// ---------- 动画工具 ----------
function animateValue(duration, onUpdate, onDone) {
  const t0 = performance.now();
  const timer = setInterval(() => {
    const p = clamp((performance.now()-t0)/duration, 0, 1);
    onUpdate(ease(p));
    if (p >= 1) { clearInterval(timer); if (onDone) onDone(); }
  }, 16);
}

// ---------- 文字粒子动画 ----------
function scatterOffsets() {
  // 每个粒子一个随机散开方向
  const arr = [];
  for (let i = 0; i < MAX_TEXT_PARTICLES; i++) {
    const a = Math.random()*Math.PI*2;
    const r = 700 + Math.random()*1400;
    arr.push(Math.cos(a)*r, Math.sin(a)*r*(.6+Math.random()*.6), (Math.random()-.5)*900);
  }
  return arr;
}
async function scatterText() {
  // 当前文字散开
  const tPos = textPoints.geometry.attributes.position;
  const from = textCurrent.slice();
  const scatter = scatterOffsets();
  await new Promise(res => animateValue(380, p => {
    for (let i = 0; i < MAX_TEXT_PARTICLES; i++) {
      const k = i*3;
      if (i*3 < from.length) {
        tPos.array[k] = from[k] + scatter[k]*p;
        tPos.array[k+1] = from[k+1] + scatter[k+1]*p;
        tPos.array[k+2] = from[k+2] + scatter[k+2]*p;
      } else {
        tPos.array[k] += (Math.random()-.5)*30;
        tPos.array[k+1] += (Math.random()-.5)*30;
      }
    }
    tPos.needsUpdate = true;
  }, res));
}
async function gatherText(text) {
  // 新文字从四面八方汇聚
  const targets = buildTextParticles(text);
  const tPos = textPoints.geometry.attributes.position;
  const scatter = scatterOffsets();
  const n3 = targets.length;
  await new Promise(res => animateValue(760, p => {
    for (let i = 0; i < MAX_TEXT_PARTICLES; i++) {
      const k = i*3;
      if (k < n3) {
        tPos.array[k] = scatter[k]*(1-p) + targets[k]*p;
        tPos.array[k+1] = scatter[k+1]*(1-p) + targets[k+1]*p;
        tPos.array[k+2] = scatter[k+2]*(1-p) + targets[k+2]*p;
      } else {
        // 多余粒子飞远
        tPos.array[k] *= .96;
        tPos.array[k+1] *= .96;
        tPos.array[k+2] *= .96;
      }
    }
    tPos.needsUpdate = true;
  }, res));
  // 记录当前显示位置（把 targets 写满到容量）
  textCurrent = new Array(MAX_TEXT_PARTICLES*3).fill(0);
  for (let i = 0; i < n3; i++) textCurrent[i] = targets[i];
  for (let i = n3; i < MAX_TEXT_PARTICLES*3; i += 3) {
    textCurrent[i] = (Math.random()-.5)*4000;
    textCurrent[i+1] = (Math.random()-.5)*4000;
    textCurrent[i+2] = (Math.random()-.5)*2000;
  }
}

// ---------- 翻页 ----------
async function goToPage(newIndex) {
  if (busy) return;
  newIndex = clamp(newIndex, 0, TOTAL_PAGES-1);
  if (newIndex === pageIndex) return;
  busy = true;
  const forward = newIndex > pageIndex;
  const safety = setTimeout(() => { busy = false; leftPivot.rotation.y = 0; rightPivot.rotation.y = 0; }, 4000);
  // 旧文字散开
  await scatterText();
  // 翻页动画：右纸板绕书脊翻越（或左纸板翻回）
  await new Promise(res => animateValue(600, p => {
    if (forward) rightPivot.rotation.y = -Math.PI*p;
    else leftPivot.rotation.y = Math.PI*p;
  }, res));
  if (forward) rightPivot.rotation.y = 0;
  else leftPivot.rotation.y = 0;
  pageIndex = newIndex;
  $('page-ind').textContent = `第 ${newIndex+1} / ${TOTAL_PAGES} 页`;
  layoutStacks();
  // 新文字从四面八方汇聚
  await gatherText(PAGES_TEXT[newIndex]);
  clearTimeout(safety);
  busy = false;
}

function renderFrame() {
  const t = performance.now()*0.001;
  const fa = framePoints.geometry.attributes.position;
  for (let i = 0; i < framePhase.length; i++) {
    const k = i*3;
    fa.array[k] = frameBase[k] + Math.sin(t*1.1+framePhase[i])*frameAmp[i]*.5;
    fa.array[k+1] = frameBase[k+1] + Math.cos(t*.9+framePhase[i])*frameAmp[i]*.4;
    fa.array[k+2] = frameBase[k+2] + Math.sin(t*.8+framePhase[i]*1.7)*frameAmp[i]*.25;
  }
  fa.needsUpdate = true;
  framePoints.material.opacity = .76 + Math.sin(t*1.4)*.24;
  starPoints.rotation.y += .0004;
  controls.update();
  rendererWebGL.render(sceneWebGL, camera);
  rendererCSS.render(sceneCSS, camera);
}
function animate() {
  function loop() {
    requestAnimationFrame(loop);
    renderFrame();
  }
  requestAnimationFrame(loop);
  // 后台节流时兜底渲染
  setInterval(renderFrame, 1000);
}

// ---------- 启动 ----------
async function start() {
  init();
  // 开场：书结构粒子从远处汇聚
  const fa = framePoints.geometry.attributes.position;
  const from = fa.array.slice();
  await new Promise(res => animateValue(1100, p => {
    for (let i = 0; i < from.length; i++) {
      fa.array[i] = from[i]*(1-p) + frameBase[i]*p;
    }
    fa.needsUpdate = true;
  }, res));
  // 第一页文字汇聚
  await gatherText(PAGES_TEXT[0]);
}

window.addEventListener('pointerdown', (e) => {
  if (busy) return;
  if (e.clientX > innerWidth*0.55) goToPage(pageIndex+1);
  else if (e.clientX < innerWidth*0.45) goToPage(pageIndex-1);
});

start();
})();
</script>
</body>
</html>
