<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Our Memory Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/renderers/CSS3DRenderer.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #05020a; color: #fff;
  font-family: 'ZCOOL KuaiLe', 'PingFang SC', sans-serif; touch-action: none; }
#webgl { position: fixed; inset: 0; z-index: 0; }
#css { position: absolute; inset: 0; z-index: 1; }
#hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
#title { position: absolute; top: 4vh; left: 0; right: 0; text-align: center;
  font: 700 30px Caveat, cursive; color: #ff9fc7; letter-spacing: 2px; text-shadow: 0 0 16px rgba(255,140,180,.7); }
#subtitle { margin-top: 4px; font: 12px 'ZCOOL KuaiLe', sans-serif; letter-spacing: 2px; color: #cfd6ff; opacity: .7; }
#page-ind { position: absolute; top: 4vh; right: 4vw; font-size: 14px; color: #ffd7e6;
  background: rgba(255,255,255,.08); border: 1px solid rgba(255,170,200,.4); border-radius: 20px; padding: 6px 14px; }
#hint { position: absolute; bottom: 3.5vh; left: 0; right: 0; text-align: center; font-size: 13px; color: #cfd6ff; opacity: .65; }
#loading { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center;
  background: #05020a; transition: opacity .8s ease; }
#loading.hidden { opacity: 0; pointer-events: none; }
.load-box { width: min(84vw, 360px); padding: 28px 22px; text-align: center; border: 1px solid rgba(255,180,210,.3);
  border-radius: 24px; background: rgba(255,255,255,.06); box-shadow: 0 16px 50px rgba(0,0,0,.7); }
.load-title { font: 700 30px Caveat, cursive; color: #ff9fc7; letter-spacing: 2px; margin-bottom: 14px; text-shadow: 0 0 20px rgba(255,150,190,.8); }
.load-text { font-size: 15px; color: #dfe4ff; }
.bar { height: 7px; margin: 18px 0 8px; border-radius: 8px; background: rgba(255,255,255,.15); overflow: hidden; }
.bar i { display: block; width: 0; height: 100%; background: linear-gradient(90deg,#ffc0ce,#ff6b8b); box-shadow: 0 0 14px #ff8ca3; border-radius: inherit; transition: width .25s; }
.load-count { font-size: 12px; color: #c9b6c8; }
.element { width: 90px; height: 120px; box-shadow: 0 0 15px rgba(255,182,193,.4);
  border: 2px solid rgba(255,255,255,.7); border-radius: 8px; cursor: pointer;
  background-size: cover; background-position: center; background-color: rgba(255,140,163,.1);
  user-select: none; -webkit-user-select: none; -webkit-user-drag: none; -webkit-touch-callout: none;
  will-change: transform; backface-visibility: visible; -webkit-backface-visibility: visible; }
#photo-modal { display: none; position: fixed; z-index: 50; inset: 0; background: rgba(0,0,0,.85); align-items: center; justify-content: center; }
#photo-modal.show { display: flex; }
#photo-modal img { max-width: 88vw; max-height: 80vh; border-radius: 12px; border: 3px solid rgba(255,182,193,.8); box-shadow: 0 0 30px rgba(0,0,0,.9); }
</style>
</head>
<body>
<div id="webgl"></div>
<div id="css"></div>
<div id="hud">
  <div id="title">andy ♥ 陶陶<span id="subtitle"><br>OUR MEMORY BOOK</span></div>
  <div id="page-ind">第 1 / 5 页 · 爱心</div>
  <div id="hint">点击屏幕左右两侧翻页 · 拖动旋转照片 · 点击照片放大</div>
</div>
<div id="loading">
  <div class="load-box">
    <div class="load-title">Preparing our memories</div>
    <div class="load-text" id="status">正在准备照片…</div>
    <div class="bar"><i id="progress"></i></div>
    <div class="load-count" id="count">照片准备中 0 / 120</div>
  </div>
</div>
<div id="photo-modal"><img id="photo-large" src="" alt=""></div>
<script>
window.onerror = function(msg, src, line) {
  var s = document.getElementById('status');
  if (s) s.textContent = 'JS错误: ' + msg + ' @' + line;
};
(() => {
'use strict';
const TOTAL_PHOTOS = 120;
const PAGE_NAMES = ['爱心', '球形', '螺旋', '网格', '圆环'];
let pageIndex = 0;
let busy = false;

let camera, sceneWebGL, sceneCSS, rendererWebGL, rendererCSS, controls, particles;
const objects = [];
const targets = { heart: [], sphere: [], helix: [], grid: [], circle: [] };

const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const imgCache = new Map();
function getImage(index) {
  const url = `assets/images/${index}.webp`;
  if (imgCache.has(url)) return imgCache.get(url);
  const p = new Promise(resolve => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = url;
  });
  imgCache.set(url, p);
  return p;
}

function init() {
  camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 1, 10000);
  camera.position.z = 2800;

  sceneWebGL = new THREE.Scene();
  const particleCount = window.innerWidth <= 768 ? 1200 : 2000;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(particleCount*3);
  for (let i = 0; i < particleCount*3; i++) pos[i] = (Math.random()-.5)*5000;
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const cv = document.createElement('canvas'); cv.width = 64; cv.height = 64;
  const c2 = cv.getContext('2d');
  const g = c2.createRadialGradient(32,32,0,32,32,32);
  g.addColorStop(0,'rgba(255,255,255,1)');
  g.addColorStop(.25,'rgba(255,182,193,1)');
  g.addColorStop(1,'rgba(0,0,0,0)');
  c2.fillStyle = g; c2.fillRect(0,0,64,64);
  const tex = new THREE.CanvasTexture(cv);
  particles = new THREE.Points(geo, new THREE.PointsMaterial({
    size: 45, map: tex, transparent: true, opacity: .95,
    blending: THREE.AdditiveBlending, depthWrite: false }));
  sceneWebGL.add(particles);
  rendererWebGL = new THREE.WebGLRenderer({ alpha: true, antialias: window.devicePixelRatio < 2 });
  rendererWebGL.setSize(innerWidth, innerHeight);
  $('webgl').appendChild(rendererWebGL.domElement);

  sceneCSS = new THREE.Scene();
  for (let i = 0; i < TOTAL_PHOTOS; i++) {
    const el = document.createElement('div');
    el.className = 'element';
    const imgIndex = i + 1;
    el.style.backgroundImage = `url('assets/images/${imgIndex}.webp')`;
    el.addEventListener('pointerup', (e) => {
      const large = $('photo-large');
      large.src = `assets/images/${imgIndex}.webp`;
      $('photo-modal').classList.add('show');
    });
    const obj = new THREE.CSS3DObject(el);
    sceneCSS.add(obj);
    objects.push(obj);
    // 双面：背面同样照片，旋转时不留白
    const backEl = document.createElement('div');
    backEl.className = 'element';
    backEl.style.backgroundImage = `url('assets/images/${imgIndex}.webp')`;
    const back = new THREE.CSS3DObject(backEl);
    back.rotation.y = Math.PI;
    obj.add(back);
  }

  // 爱心
  const scale = 45;
  for (let i = 0; i < objects.length; i++) {
    const t = (i/objects.length)*Math.PI*2;
    const x = 16*Math.pow(Math.sin(t),3)*scale;
    const y = (13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))*scale;
    const o = new THREE.Object3D();
    o.position.set(x, y+150, (Math.random()-.5)*400);
    targets.heart.push(o);
  }
  // 球形
  const v = new THREE.Vector3();
  for (let i = 0, l = objects.length; i < l; i++) {
    const phi = Math.acos(-1+(2*i)/l);
    const theta = Math.sqrt(l*Math.PI)*phi;
    const o = new THREE.Object3D();
    o.position.setFromSphericalCoords(900, phi, theta);
    v.copy(o.position).multiplyScalar(2);
    o.lookAt(v);
    targets.sphere.push(o);
  }
  // 螺旋
  for (let i = 0, l = objects.length; i < l; i++) {
    const theta = i*0.25 + Math.PI;
    const y = -(i*15) + 900;
    const o = new THREE.Object3D();
    o.position.setFromCylindricalCoords(900, theta, y);
    v.set(o.position.x*2, o.position.y, o.position.z*2);
    o.lookAt(v);
    targets.helix.push(o);
  }
  // 网格
  for (let i = 0; i < objects.length; i++) {
    const o = new THREE.Object3D();
    o.position.x = ((i%6)*250) - 600;
    o.position.y = (-(Math.floor(i/6)%5)*250) + 500;
    o.position.z = (Math.floor(i/30))*500 - 1000;
    targets.grid.push(o);
  }
  // 圆环（双层交错的环）
  for (let i = 0; i < objects.length; i++) {
    const o = new THREE.Object3D();
    const ring = i % 2;
    const t = (i/objects.length)*Math.PI*2;
    const r = ring ? 1050 : 780;
    o.position.set(Math.cos(t)*r, Math.sin(t)*r*0.9, ring ? 220 : -220);
    targets.circle.push(o);
  }

  rendererCSS = new THREE.CSS3DRenderer();
  rendererCSS.setSize(innerWidth, innerHeight);
  rendererCSS.domElement.style.position = 'absolute';
  rendererCSS.domElement.style.top = '0';
  $('css').appendChild(rendererCSS.domElement);

  controls = new THREE.OrbitControls(camera, rendererCSS.domElement);
  controls.minDistance = 500;
  controls.maxDistance = 8000;
  controls.enablePan = true;
  controls.enableZoom = true;
  controls.enableDamping = true;
  controls.dampingFactor = .05;
  controls.autoRotate = true;
  controls.autoRotateSpeed = .8;

  window.addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    rendererWebGL.setSize(innerWidth, innerHeight);
    rendererCSS.setSize(innerWidth, innerHeight);
  });

  // 初始显示爱心（所有照片就位）
  for (let i = 0; i < objects.length; i++) {
    objects[i].position.copy(targets.heart[i].position);
    objects[i].rotation.copy(targets.heart[i].rotation);
  }
  animate();
}

function transform(targetList, duration) {
  TWEEN.removeAll();
  for (let i = 0; i < objects.length; i++) {
    const obj = objects[i], t = targetList[i];
    new TWEEN.Tween(obj.position)
      .to({ x: t.position.x, y: t.position.y, z: t.position.z }, Math.random()*duration + duration)
      .easing(TWEEN.Easing.Exponential.InOut).start();
    new TWEEN.Tween(obj.rotation)
      .to({ x: t.rotation.x, y: t.rotation.y, z: t.rotation.z }, Math.random()*duration + duration)
      .easing(TWEEN.Easing.Exponential.InOut).start();
  }
}

function goToPage(newIndex) {
  if (busy) return;
  newIndex = clamp(newIndex, 0, PAGE_NAMES.length-1);
  if (newIndex === pageIndex) return;
  busy = true;
  pageIndex = newIndex;
  $('page-ind').textContent = `第 ${newIndex+1} / ${PAGE_NAMES.length} 页 · ${PAGE_NAMES[newIndex]}`;
  const list = [targets.heart, targets.sphere, targets.helix, targets.grid, targets.circle][newIndex];
  transform(list, 1200);
  setTimeout(() => { busy = false; }, 2400);
}

function animate() {
  requestAnimationFrame(animate);
  TWEEN.update();
  if (particles) {
    particles.rotation.y += .0008;
    particles.rotation.x += .0004;
  }
  controls.update();
  rendererWebGL.render(sceneWebGL, camera);
  rendererCSS.render(sceneCSS, camera);
}

async function preloadAllPhotos() {
  const loaded = new Array(TOTAL_PHOTOS+1).fill(false);
  let done = 0, cursor = 1;
  const CONCURRENCY = 8;
  const finish = (index) => {
    if (index >= 1 && index <= TOTAL_PHOTOS && !loaded[index]) {
      loaded[index] = true; done++;
      $('progress').style.width = Math.round(done/TOTAL_PHOTOS*100) + '%';
      $('count').textContent = `照片准备中 ${done} / ${TOTAL_PHOTOS}`;
    }
    if (done >= TOTAL_PHOTOS) {
      $('status').textContent = '照片准备完成';
      setTimeout(() => $('loading').classList.add('hidden'), 400);
    }
  };
  const loadNext = () => {
    if (cursor > TOTAL_PHOTOS) return;
    const index = cursor++;
    getImage(index).then(() => { finish(index); loadNext(); });
  };
  for (let i = 0; i < CONCURRENCY; i++) loadNext();
}

init();
preloadAllPhotos();

window.addEventListener('pointerdown', (e) => {
  if (e.target && e.target.closest && e.target.closest('#loading')) return;
  if (e.target.closest && e.target.closest('#photo-modal')) return;
  if (busy) return;
  if (e.clientX > innerWidth*0.55) goToPage(pageIndex+1);
  else if (e.clientX < innerWidth*0.45) goToPage(pageIndex-1);
});
$('photo-modal').addEventListener('click', () => $('photo-modal').classList.remove('show'));
})();
</script>
</body>
</html>
