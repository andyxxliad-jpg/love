<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Our Memory Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/renderers/CSS3DRenderer.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #05020a; color: #fff;
  font-family: 'ZCOOL KuaiLe', 'PingFang SC', sans-serif; touch-action: none; }
#webgl { position: fixed; inset: 0; z-index: 0; }
#css { position: absolute; inset: 0; z-index: 1; }
#hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
#title { position: absolute; top: 4vh; left: 0; right: 0; text-align: center;
  font: 700 30px Caveat, cursive; color: #ff9fc7; letter-spacing: 2px; text-shadow: 0 0 16px rgba(255,140,180,.7); }
#subtitle { margin-top: 4px; font: 12px 'ZCOOL KuaiLe', sans-serif; letter-spacing: 2px; color: #cfd6ff; opacity: .7; }
#page-ind { position: absolute; top: 4vh; right: 4vw; font-size: 14px; color: #ffd7e6;
  background: rgba(255,255,255,.08); border: 1px solid rgba(255,170,200,.4); border-radius: 20px; padding: 6px 14px; }
#hint { position: absolute; bottom: 3.5vh; left: 0; right: 0; text-align: center; font-size: 13px; color: #cfd6ff; opacity: .65; }
#loading { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center;
  background: #05020a; transition: opacity .8s ease; }
#loading.hidden { opacity: 0; pointer-events: none; }
.load-box { width: min(84vw, 360px); padding: 28px 22px; text-align: center; border: 1px solid rgba(255,180,210,.3);
  border-radius: 24px; background: rgba(255,255,255,.06); box-shadow: 0 16px 50px rgba(0,0,0,.7); }
.load-title { font: 700 30px Caveat, cursive; color: #ff9fc7; letter-spacing: 2px; margin-bottom: 14px; text-shadow: 0 0 20px rgba(255,150,190,.8); }
.load-text { font-size: 15px; color: #dfe4ff; }
.bar { height: 7px; margin: 18px 0 8px; border-radius: 8px; background: rgba(255,255,255,.15); overflow: hidden; }
.bar i { display: block; width: 0; height: 100%; background: linear-gradient(90deg,#ffc0ce,#ff6b8b); box-shadow: 0 0 14px #ff8ca3; border-radius: inherit; transition: width .25s; }
.load-count { font-size: 12px; color: #c9b6c8; }
/* 书本各部件 */
.book-paper { position: relative; background: #f6f1e6; border-radius: 6px 14px 14px 6px;
  box-shadow: inset 0 0 30px rgba(130,105,80,.25), 0 0 20px rgba(0,0,0,.5); }
.book-paper.right { border-radius: 14px 6px 6px 14px; }
.book-spine { position: relative; background: linear-gradient(90deg,#4d1d2d,#8a4a5e,#4d1d2d); border-radius: 6px; }
.book-cover-back { position: relative; background: #2b1220; border: 2px solid rgba(255,160,200,.35); border-radius: 16px; }
.book-photo { position: relative; border-radius: 8px; overflow: hidden; cursor: pointer;
  border: 3px solid rgba(255,255,255,.85);
  box-shadow: 0 10px 30px rgba(0,0,0,.65), 0 0 24px rgba(255,140,180,.5);
  background-size: cover; background-position: center; background-color: #241625;
  will-change: transform; backface-visibility: visible; -webkit-backface-visibility: visible;
  user-select: none; -webkit-user-select: none; -webkit-user-drag: none; }
#photo-modal { display: none; position: fixed; z-index: 50; inset: 0; background: rgba(0,0,0,.85); align-items: center; justify-content: center; }
#photo-modal.show { display: flex; }
#photo-modal img { max-width: 88vw; max-height: 80vh; border-radius: 12px; border: 3px solid rgba(255,182,193,.8); box-shadow: 0 0 30px rgba(0,0,0,.9); }
</style>
</head>
<body>
<div id="webgl"></div>
<div id="css"></div>
<div id="hud">
  <div id="title">andy ♥ 陶陶<span id="subtitle"><br>OUR MEMORY BOOK</span></div>
  <div id="page-ind">第 1 / 5 页</div>
  <div id="hint">点击屏幕左右两侧翻页 · 拖动旋转书本 · 点击照片放大</div>
</div>
<div id="loading">
  <div class="load-box">
    <div class="load-title">Preparing our memories</div>
    <div class="load-text" id="status">正在准备照片…</div>
    <div class="bar"><i id="progress"></i></div>
    <div class="load-count" id="count">照片准备中 0 / 10</div>
  </div>
</div>
<div id="photo-modal"><img id="photo-large" src="" alt=""></div>
<script>
window.onerror = function(msg, src, line) {
  var s = document.getElementById('status');
  if (s) s.textContent = 'JS错误: ' + msg + ' @' + line;
};
(() => {
'use strict';
const PAGE_W = 330, PAGE_H = 440;   // 单页纸面尺寸
const TOTAL_PAGES = 5;              // 5 页 = 10 张照片
let pageIndex = 0;                  // 0..4
let busy = false;

let sceneWebGL, sceneCSS, camera, rendererWebGL, rendererCSS, controls, particles;
let bookGroup, leftPivot, rightPivot, leftPhoto, rightPhoto, leftPhotoBack, rightPhotoBack;

const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
const imgCache = new Map();
function getImage(index) {
  const url = `assets/images/${index}.webp`;
  if (imgCache.has(url)) return imgCache.get(url);
  const p = new Promise(resolve => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = url;
  });
  imgCache.set(url, p);
  return p;
}

function makeDiv(className, w, h) {
  const d = document.createElement('div');
  d.className = className;
  d.style.width = w + 'px';
  d.style.height = h + 'px';
  return d;
}
function cssObject(el, x, y, z) {
  const o = new THREE.CSS3DObject(el);
  o.position.set(x, y, z);
  return o;
}

function init() {
  camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 1, 12000);
  camera.position.set(0, 140, 2100);
  camera.lookAt(0, 0, 0);

  // 星空
  sceneWebGL = new THREE.Scene();
  const n = innerWidth <= 768 ? 1200 : 2000;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(n*3);
  for (let i = 0; i < n*3; i++) pos[i] = (Math.random()-.5)*5000;
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const cv = document.createElement('canvas'); cv.width = 64; cv.height = 64;
  const c2 = cv.getContext('2d');
  const g = c2.createRadialGradient(32,32,0,32,32,32);
  g.addColorStop(0,'rgba(255,255,255,1)');
  g.addColorStop(.25,'rgba(255,182,193,1)');
  g.addColorStop(1,'rgba(0,0,0,0)');
  c2.fillStyle = g; c2.fillRect(0,0,64,64);
  particles = new THREE.Points(geo, new THREE.PointsMaterial({
    size: 40, map: new THREE.CanvasTexture(cv), transparent: true, opacity: .95,
    blending: THREE.AdditiveBlending, depthWrite: false }));
  sceneWebGL.add(particles);
  rendererWebGL = new THREE.WebGLRenderer({ alpha: true, antialias: window.devicePixelRatio < 2 });
  rendererWebGL.setSize(innerWidth, innerHeight);
  $('webgl').appendChild(rendererWebGL.domElement);

  // 书本（CSS3D）
  sceneCSS = new THREE.Scene();
  bookGroup = new THREE.Group();
  bookGroup.rotation.x = -0.12;
  sceneCSS.add(bookGroup);

  // 书皮底板（略大，V 形张开感）
  const coverL = cssObject(makeDiv('book-cover-back', PAGE_W+40, PAGE_H+40), -PAGE_W/2-22, -6, -26);
  const coverR = cssObject(makeDiv('book-cover-back', PAGE_W+40, PAGE_H+40), PAGE_W/2+22, -6, -26);
  coverL.rotation.y = 0.09;
  coverR.rotation.y = -0.09;
  bookGroup.add(coverL, coverR);

  // 左右纸页（挂在书脊转轴上）
  leftPivot = new THREE.Group();
  rightPivot = new THREE.Group();
  leftPivot.rotation.order = 'YXZ';
  rightPivot.rotation.order = 'YXZ';
  const paperL = cssObject(makeDiv('book-paper', PAGE_W, PAGE_H), -PAGE_W/2, 0, 0);
  const paperR = cssObject(makeDiv('book-paper right', PAGE_W, PAGE_H), PAGE_W/2, 0, 0);
  leftPivot.add(paperL);
  rightPivot.add(paperR);
  bookGroup.add(leftPivot, rightPivot);

  // 照片卡片（立体：正面 + 背面，浮在纸面上方一点，随视角呈现 3D 透视）
  const PH_W = PAGE_W - 56, PH_H = PAGE_H - 76;
  leftPhoto = cssObject(makeDiv('book-photo', PH_W, PH_H), -PAGE_W/2, 4, 14);
  leftPhotoBack = cssObject(makeDiv('book-photo', PH_W, PH_H), -PAGE_W/2, 4, 14);
  leftPhotoBack.rotation.y = Math.PI;
  leftPivot.add(leftPhoto);
  leftPivot.add(leftPhotoBack);

  rightPhoto = cssObject(makeDiv('book-photo', PH_W, PH_H), PAGE_W/2, 4, 14);
  rightPhotoBack = cssObject(makeDiv('book-photo', PH_W, PH_H), PAGE_W/2, 4, 14);
  rightPhotoBack.rotation.y = Math.PI;
  rightPivot.add(rightPhoto);
  rightPivot.add(rightPhotoBack);

  // 书脊
  const spine = cssObject(makeDiv('book-spine', 22, PAGE_H + 14), 0, 0, 4);
  bookGroup.add(spine);

  rendererCSS = new THREE.CSS3DRenderer();
  rendererCSS.setSize(innerWidth, innerHeight);
  rendererCSS.domElement.style.position = 'absolute';
  rendererCSS.domElement.style.top = '0';
  $('css').appendChild(rendererCSS.domElement);

  controls = new THREE.OrbitControls(camera, rendererCSS.domElement);
  controls.minDistance = 700;
  controls.maxDistance = 6000;
  controls.enablePan = true;
  controls.enableZoom = true;
  controls.enableDamping = true;
  controls.dampingFactor = .06;
  controls.autoRotate = false;

  window.addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    rendererWebGL.setSize(innerWidth, innerHeight);
    rendererCSS.setSize(innerWidth, innerHeight);
    fitBook();
  });
  fitBook();
  animate();
}
function fitBook() {
  const fov = camera.fov*Math.PI/180;
  const dist = camera.position.length();
  const worldH = 2*dist*Math.tan(fov/2);
  const worldW = worldH * camera.aspect;
  const s = Math.min(worldW/(PAGE_W*2+120), worldH/(PAGE_H+160)) * 0.94;
  bookGroup.scale.set(s, s, s);
}

function setPhoto(el, back, index) {
  const url = `assets/images/${index}.webp`;
  el.element.style.backgroundImage = `url('${url}')`;
  back.element.style.backgroundImage = `url('${url}')`;
  el.element.dataset.photo = index;
  back.element.dataset.photo = index;
}

function animateValue(duration, onUpdate, onDone) {
  const t0 = performance.now();
  const timer = setInterval(() => {
    const p = clamp((performance.now() - t0)/duration, 0, 1);
    onUpdate(ease(p));
    if (p >= 1) {
      clearInterval(timer);
      if (onDone) onDone();
    }
  }, 16);
}
async function goToPage(newIndex) {
  if (busy) return;
  newIndex = clamp(newIndex, 0, TOTAL_PAGES-1);
  if (newIndex === pageIndex) return;
  busy = true;
  const safety = setTimeout(() => {
    busy = false;
    leftPivot.rotation.y = 0; rightPivot.rotation.y = 0;
  }, 2500);
  const forward = newIndex > pageIndex;
  const leftNo = newIndex*2+1, rightNo = newIndex*2+2;
  await Promise.all([getImage(leftNo), getImage(rightNo)]);
  // 翻页动画：右页带着新照片从右往左翻，或左页带着新照片从左往右翻
  if (forward) {
    setPhoto(rightPhoto, rightPhotoBack, rightNo);
    let swapped = false;
    await new Promise(res => animateValue(650, p => {
      rightPivot.rotation.y = -Math.PI*p;
      if (p >= .5 && !swapped) {
        swapped = true;
        setPhoto(leftPhoto, leftPhotoBack, leftNo);
      }
    }, res));
    rightPivot.rotation.y = 0;
  } else {
    setPhoto(leftPhoto, leftPhotoBack, leftNo);
    let swapped = false;
    await new Promise(res => animateValue(650, p => {
      leftPivot.rotation.y = Math.PI*p;
      if (p >= .5 && !swapped) {
        swapped = true;
        setPhoto(rightPhoto, rightPhotoBack, rightNo);
      }
    }, res));
    leftPivot.rotation.y = 0;
  }
  clearTimeout(safety);
  pageIndex = newIndex;
  $('page-ind').textContent = `第 ${newIndex+1} / ${TOTAL_PAGES} 页`;
  busy = false;
}

function animate() {
  requestAnimationFrame(animate);
  if (particles) {
    particles.rotation.y += .0008;
    particles.rotation.x += .0004;
  }
  controls.update();
  rendererWebGL.render(sceneWebGL, camera);
  rendererCSS.render(sceneCSS, camera);
}

async function preloadPhotos() {
  const TOTAL = 10;
  let done = 0;
  const jobs = [];
  for (let i = 1; i <= TOTAL; i++) {
    jobs.push(getImage(i).then(() => {
      done++;
      $('progress').style.width = Math.round(done/TOTAL*100) + '%';
      $('count').textContent = `照片准备中 ${done} / ${TOTAL}`;
      if (done >= TOTAL) {
        $('status').textContent = '照片准备完成';
        setTimeout(() => $('loading').classList.add('hidden'), 400);
      }
    }));
  }
  await Promise.all(jobs);
}

init();
preloadPhotos();
setPhoto(leftPhoto, leftPhotoBack, 1);
setPhoto(rightPhoto, rightPhotoBack, 2);

window.addEventListener('pointerdown', (e) => {
  if (e.target && e.target.closest && e.target.closest('#loading')) return;
  if (e.target.closest && e.target.closest('#photo-modal')) return;
  if (busy) return;
  if (e.clientX > innerWidth*0.55) goToPage(pageIndex+1);
  else if (e.clientX < innerWidth*0.45) goToPage(pageIndex-1);
});
document.addEventListener('pointerup', (e) => {
  const el = e.target.closest && e.target.closest('.book-photo');
  if (el && el.dataset.photo) {
    $('photo-large').src = `assets/images/${el.dataset.photo}.webp`;
    $('photo-modal').classList.add('show');
  }
});
$('photo-modal').addEventListener('click', () => $('photo-modal').classList.remove('show'));
})();
</script>
</body>
</html>
