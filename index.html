<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Our Little Universe</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css?v=31">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/renderers/CSS3DRenderer.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="webgl-container"></div>
    <div id="css-container"></div>

    <div id="photo-loading-screen" class="photo-loading-screen">
        <div class="photo-loading-box">
            <h2 class="en-font">Preparing our memories</h2>
            <p id="photo-loading-status">正在准备照片…</p>
            <div class="photo-progress"><div id="photo-progress-bar"></div></div>
            <small id="photo-loading-count">照片准备中 0 / 120</small>
        </div>
    </div>

    <div id="welcome-screen" class="welcome-screen">
        <div class="welcome-box">
            <h2 class="en-font" style="font-size: 32px; margin-bottom: 15px; color: #ff8ca3;">Hey, Baby</h2>
            <p id="weather-text">偷偷给你准备了一个小惊喜<br>点一下下面，让我看看你那的天气~</p>
            <button id="btn-location" class="cute-btn">获取天气信息 ☁️</button>
            <button id="btn-enter" class="cute-btn" style="display: none;">去看我给你准备的惊喜 🚀</button>
        </div>
    </div>

    <div class="ui-layer" id="main-ui" style="opacity: 0; pointer-events: none; transition: opacity 1.5s;">
        <div class="header">
            <div class="badge en-font">andy ♥ 陶陶</div>
            <div class="timer-box" id="timer-box">
                我们已经在一起：<br>
                <span class="num" id="t-days">0</span> 天 
                <span class="num" id="t-hours">0</span> 时 
                <span class="num" id="t-mins">0</span> 分 
                <span class="num" id="t-secs">0</span> 秒
            </div>
            <div class="subtitle">滑动可以旋转星空，点击照片可以放大哦✨</div>
            <button id="letter-shortcut" class="letter-shortcut" onclick="showModal('letter-modal')" aria-label="打开信件">✉</button>
        </div>

        <div class="lyrics-box" id="quotes-box">
            回忆正在加载中...
        </div>

    </div>

    <div id="photo-modal" class="modal" onclick="hideModal('photo-modal')">
        <div class="modal-content photo-modal-content" onclick="event.stopPropagation()">
            <span class="close" onclick="hideModal('photo-modal')" style="top: -30px; right: 0;">&times;</span>
            <img id="enlarged-photo" src="" alt="我们的回忆">
        </div>
    </div>

    <div id="letter-modal" class="modal">
        <div class="modal-content letter-bg">
            <span class="close" onclick="hideModal('letter-modal')">&times;</span>
            <div class="tag en-font">ONLY FOR YOU</div>
            <h2 class="modal-title" style="text-align: left; margin-bottom: 20px;">To 亲爱的：</h2>
            <div class="typewriter-content" id="typewriter-content"></div>
            <div class="signature en-font">Yours</div>
        </div>
    </div>

    <audio id="bgm" src="assets/audio/1.mp3" loop></audio>
    <script src="js/main.js?v=31"></script>
<div id="blackout"></div>
</body>
</html>
